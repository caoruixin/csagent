schema_version: '0.2'
spec_type: customer_service_agent_tool_spec
project:
  name: Gumtree Customer Service Live Chat Bot
  channel: salesforce_enhanced_chat_web
  phase: V1
  updated: '2026-04-21'
  changelog_from_v0_1:
    - concrete_api_mapping_from_platform_api_reference
    - prechat_form_integration
    - pgvector_retrieval_backend
    - new_tool_get_moderation_review_context
    - fixed_script_library_runtime_capability
    - allowed_disallowed_matrix_fixes
    - enriched_output_schemas
    - parent_topic_subject_per_uc_and_handover_only_topic_subjects
    - uc_c_messaging_diagnostic_tool_matrix_fix_and_new_get_message_moderation_context

principles:
  tool_surface_strategy: small_and_strong
  agent_pattern: single_agent_bounded_loop
  grounding_policy: grounded_before_generative
  escalation_policy: escalation_is_first_class
  sensitive_write_actions: human_only_or_phase2

use_cases:
  - id: UC-A
    parent_topic_subject: Ad Support
  - id: UC-B
    parent_topic_subject: Ad Support
  - id: UC-C
    parent_topic_subject: Replies or Messaging
  - id: UC-D
    parent_topic_subject: Account Support
  - id: UC-E
    parent_topic_subject: Technical Support
  - id: UC-F
    parent_topic_subject: Payments
  - id: UC-FP
    parent_topic_subject: Ad Support
  - id: UC-G
    parent_topic_subject: Delete My Account or Data
  - id: UC-H
    parent_topic_subject: Ad Support
  - id: UC-I
    parent_topic_subject: Payments
  - id: UC-J
    parent_topic_subject: Report a Safety Issue
  - id: UC-K
    parent_topic_subject: Technical Support

# Topic Subjects without V1 UC coverage (handover-only):
# - Delivery
# - Pro Contract
# - Account Manager Support
# - Ratings Reviews
# These are routed to fixed_script_library out_of_scope templates + request_handover.
# See phase2_domain_realization_spec.md §2.11 for routing strategy.

# ============================================================
# AGENT-VISIBLE TOOLS (5)
# ============================================================

tools:
  # ---- 1. search_knowledge ----
  - tool_name: search_knowledge
    display_name: Search Knowledge
    visibility: agent_visible
    phase: V1
    tool_class: knowledge_retrieval
    risk_tier: low
    purpose: >
      Search FAQ vector store (pgvector) + Salesforce Knowledge metadata
      and return grounded candidate sources for the active use case.
    allowed_use_cases: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP]
    disallowed_use_cases: [UC-G, UC-H, UC-I, UC-J, UC-K]
    trigger_examples:
      - user asks how to do something
      - user asks why an ad is not visible
      - user asks for policy or process explanation
      - bot needs a grounded FAQ answer before responding
    input_schema:
      type: object
      required: [query, use_case_id]
      properties:
        query:
          type: string
          description: Search query derived from user issue or form_context.description.
        use_case_id:
          type: string
          enum: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP]
        customer_locale:
          type: string
          default: en_GB
        top_k:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        knowledge_scope:
          type: array
          items:
            type: string
    output_schema:
      type: object
      required: [results, faq_miss]
      properties:
        results:
          type: array
          items:
            type: object
            required: [source_id, title, snippet, canonical_url, score]
            properties:
              source_id:
                type: string
                description: "Salesforce Knowledge Article Id"
              title:
                type: string
              snippet:
                type: string
              canonical_url:
                type: string
                description: "Help_Site_URL__c"
              score:
                type: number
              source_type:
                type: string
                enum: [salesforce_knowledge, help_centre, approved_git_doc]
              chunk_id:
                type: string
              article_id:
                type: string
        faq_miss:
          type: boolean
        retrieval_trace:
          type: object
    retrieval_backend:
      type: pgvector_on_cloud_sql_postgresql
      embedding_model: TBD_vertex_ai_or_gemini
      chunk_strategy: sliding_window_256_512_tokens_overlap_10_20_pct
      index_type: TBD_ivfflat_or_hnsw
      score_threshold: TBD
    concrete_api_dependencies:
      - endpoint: POST /v1/faq/search
        service: csagent_service
        purpose: pgvector semantic search
      - endpoint: Salesforce Knowledge API
        service: salesforce
        purpose: article metadata + publish status verification
      - endpoint: Vertex AI text-embedding API
        service: gcp
        purpose: query embedding
    failure_modes:
      - no_results
      - low_confidence_results
      - knowledge_backend_timeout
      - scope_blocked
    runtime_policy:
      max_retries: 1
      on_no_results: allow_clarification_or_escalate
      must_log_article_candidates: true

  # ---- 2. resolve_article ----
  - tool_name: resolve_article
    display_name: Resolve Article
    visibility: agent_visible
    phase: V1
    tool_class: knowledge_resolution
    risk_tier: low
    purpose: >
      Convert candidate knowledge results into a customer-safe article package
      with title, concise summary, canonical link, and usage boundary.
    allowed_use_cases: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP]
    disallowed_use_cases: [UC-G, UC-H, UC-I, UC-J, UC-K]
    input_schema:
      type: object
      required: [source_ids, use_case_id]
      properties:
        source_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
        use_case_id:
          type: string
          enum: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP]
        summary_style:
          type: string
          enum: [concise, standard]
          default: concise
    output_schema:
      type: object
      required: [resolved_articles]
      properties:
        resolved_articles:
          type: array
          items:
            type: object
            required: [source_id, title, summary, canonical_url]
            properties:
              source_id:
                type: string
              title:
                type: string
              summary:
                type: string
              canonical_url:
                type: string
              safe_to_show:
                type: boolean
              usage_boundary:
                type: string
        article_shown_log_payload:
          type: object
    concrete_api_dependencies:
      - endpoint: Salesforce Knowledge API (by article Id)
        service: salesforce
        purpose: article metadata + published status
      - endpoint: Help_Site_URL__c field
        service: salesforce
        purpose: canonical URL resolution
    failure_modes:
      - invalid_source_id
      - article_not_public
      - summary_generation_blocked
    runtime_policy:
      must_track_article_shown: true
      customer_output_pattern: title_plus_1_to_3_sentence_summary_plus_link
      must_verify_published_status: true

  # ---- 3. get_customer_context ----
  - tool_name: get_customer_context
    display_name: Get Customer Context
    visibility: agent_visible
    phase: V1
    tool_class: composite_context_read
    risk_tier: medium
    purpose: >
      Read minimum necessary customer, account, and listing context from
      trusted systems. Returns safe structured summary. Composes
      lookup_customer_account + lookup_listing_or_ad + get_moderation_review_context.
    allowed_use_cases: [UC-A, UC-C, UC-D, UC-F, UC-FP, UC-K]
    disallowed_use_cases: [UC-B, UC-E, UC-G, UC-H, UC-I, UC-J]
    trigger_examples:
      - pre-chat form provides email -> auto-trigger at INIT
      - pre-chat form provides ad_id -> auto-trigger listing lookup
      - user provides ad ID for listing visibility issue
      - bot needs authoritative context before answering or escalating
    input_schema:
      type: object
      required: [context_type]
      properties:
        context_type:
          type: string
          enum: [account, listing, combined]
        email:
          type: string
        phone:
          type: string
        account_id:
          type: string
        listing_id:
          type: string
        ad_id:
          type: string
        use_case_id:
          type: string
        form_context:
          type: object
          description: "Pre-chat form data injected at INIT"
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              description: "New form: mandatory"
            topic_subject:
              type: string
            ad_id_number:
              type: string
              description: "New form: optional"
            description:
              type: string
              description: "New form: mandatory"
    output_schema:
      type: object
      required: [safe_summary]
      properties:
        safe_summary:
          type: string
        account_context:
          type: object
          properties:
            account_id:
              type: string
            account_status:
              type: string
              enum: [ACTIVE, SUSPENDED, CLOSED, COLLECTION_AGENCY]
            restriction_flags:
              type: array
              items:
                type: string
            blacklist_status:
              type: object
              properties:
                is_blacklisted:
                  type: boolean
                reason:
                  type: string
            known_good:
              type: boolean
            last_login_date:
              type: string
              format: date-time
            identity_match_confidence:
              type: number
        listing_context:
          type: object
          properties:
            ad_id:
              type: string
            listing_status:
              type: string
            moderation_status:
              type: string
            visibility_reason:
              type: string
            moderation_review_reason:
              type: string
            deletion_reason_code:
              type: string
            known_good:
              type: boolean
        missing_identifiers:
          type: array
          items:
            type: string
    concrete_api_dependencies:
      account_chain:
        - endpoint: GET /api/emails/{email}/user
          service: bapi-server
        - endpoint: GET /users/{email}/user
          service: user-service
          note: fallback
        - endpoint: GET /api/accounts/{accountId}
          service: bapi-server
        - endpoint: GET /api/accounts/{id}/emails
          service: bapi-server
        - endpoint: GET /api/users/{id}/known-good
          service: gumshield-api
        - endpoint: POST /api/blacklists/email/check
          service: gumshield-api
        - endpoint: GET /users/last-logged-in/{userId}
          service: user-service
      listing_chain:
        - endpoint: GET /api/adverts/{id}
          service: bapi-server
        - endpoint: GET /api/adverts/by-advert-id/{advert-id}
          service: advert-service
          note: alternative
        - endpoint: GET /api/adverts/{id}/features
          service: bapi-server
        - endpoint: GET /api/adverts/status/{id}
          service: gumshield-api
        - endpoint: GET /api/adverts/{id}/known-good
          service: gumshield-api
        - endpoint: GET /api/advert/{advertId}
          service: livead-search
        - endpoint: GET /api/accounts/{id}/adverts
          service: bapi-server
          note: list user ads
      moderation_review_chain:
        - endpoint: POST /api/cs-review/ad-id/
          service: gumshield-api
        - endpoint: POST /api/cs-review/latest/
          service: gumshield-api
    failure_modes:
      - identifier_missing
      - no_matching_record
      - multiple_matches
      - backend_timeout
      - permission_denied
    runtime_policy:
      must_minimize_pii: true
      must_return_safe_summary_only: true
      should_prompt_for_identifiers_when_missing: true
      must_auto_trigger_on_form_context: true

  # ---- 4. request_handover ----
  - tool_name: request_handover
    display_name: Request Handover
    visibility: agent_visible
    phase: V1
    tool_class: controlled_write_action
    risk_tier: medium
    purpose: >
      Escalate the conversation to a human queue with structured handover
      payload and customer-visible next-step messaging.
    allowed_use_cases: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP, UC-G, UC-H, UC-I, UC-J, UC-K]
    disallowed_use_cases: []
    trigger_examples:
      - user explicitly requests human
      - faq miss threshold exceeded
      - high-risk or out-of-scope issue detected
      - customer frustration or negative sentiment
      - intake complete for UC-G/H/I/J/K
    input_schema:
      type: object
      required: [primary_use_case, summary, escalation_reason]
      properties:
        primary_use_case:
          type: string
        candidate_use_cases:
          type: array
          items:
            type: string
        intent_confidence:
          type: number
        summary:
          type: string
          maxLength: 500
        customer_answers:
          type: object
        articles_shown:
          type: array
          items:
            type: string
        identifiers:
          type: object
        escalation_reason:
          type: string
          enum:
            - user_requested
            - faq_miss_threshold_exceeded
            - clarification_budget_exhausted
            - intake_complete_for_uc_g
            - intake_complete_for_uc_h
            - intake_complete_for_uc_i
            - intake_complete_for_uc_j
            - intake_complete_for_uc_k
            - incomplete_intake
            - payment_dispute_detected
            - appeal_requires_human
            - user_distress
            - imminent_harm
            - incorrect_deletion_appeal
            - trust_safety_required
            - account_compliance
            - gdpr_intake
            - identity_verification_required
            - out_of_scope
            - service_degraded
            - turn_budget_exhausted
            - tool_scope_blocked
        case_id:
          type: string
        is_business_hours:
          type: boolean
    output_schema:
      type: object
      required: [handover_status]
      properties:
        handover_status:
          type: string
          enum: [queued, transferred, offline_logged, failed]
        queue:
          type: string
        handover_id:
          type: string
        customer_next_step_message:
          type: string
    concrete_api_dependencies:
      - endpoint: Salesforce Omni-Channel Transfer API
        service: salesforce
        purpose: route to queue
      - endpoint: Salesforce Bot_Context__c field write
        service: salesforce
        purpose: persist handover payload
      - endpoint: Salesforce Messaging Session API
        service: salesforce
        purpose: same-thread continuity
    failure_modes:
      - queue_unavailable
      - handover_contract_invalid
      - transfer_api_failure
    runtime_policy:
      must_preserve_same_thread: true
      must_include_structured_summary: true
      must_log_escalation_reason: true
      must_select_message_by_hours_and_reason: true

  # ---- 5. record_outcome ----
  - tool_name: record_outcome
    display_name: Record Outcome
    visibility: agent_visible
    phase: V1
    tool_class: analytics_trace
    risk_tier: low
    purpose: >
      Record session outcome, shown articles, escalation reason, and trace
      metadata for reporting and evaluation.
    allowed_use_cases: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP, UC-G, UC-H, UC-I, UC-J, UC-K]
    disallowed_use_cases: []
    input_schema:
      type: object
      required: [session_id, outcome, use_case_id]
      properties:
        session_id:
          type: string
        outcome:
          type: string
          enum:
            - resolved
            - escalated
            - abandoned
            - wrong_containment
            - over_escalation
            - unresolved_after_answer
        use_case_id:
          type: string
        articles_shown:
          type: array
          items:
            type: string
        escalation_reason:
          type: string
        trace_metadata:
          type: object
    output_schema:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed]
    concrete_api_dependencies:
      - endpoint: Salesforce Bot_Session__c.ContainmentOutcome__c
        service: salesforce
        purpose: outcome persistence
      - endpoint: Salesforce Bot_Event__c
        service: salesforce
        purpose: event log
      - endpoint: Kafka (Avro) analytics topic
        service: kafka
        purpose: analytics pipeline
      - endpoint: PostgreSQL session_outcomes table
        service: csagent_db
        purpose: local trace store
    failure_modes:
      - analytics_sink_unavailable
      - trace_write_failed
    runtime_policy:
      must_be_called_on_close_or_escalation: true
      retry_on_failure: true

# ============================================================
# RUNTIME-ONLY TOOLS (4, was 3 in v0.1)
# ============================================================

  # ---- 6. create_case_controlled ----
  - tool_name: create_case_controlled
    display_name: Create Case (Controlled)
    visibility: runtime_only
    phase: V1_limited
    tool_class: controlled_write_action
    risk_tier: high
    purpose: >
      Create a Salesforce Case for explicitly allowed categories when
      required fields are present and policy permits.
    allowed_use_cases: [UC-H, UC-J, UC-K]
    disallowed_use_cases: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP, UC-G, UC-I]
    input_schema:
      type: object
      required: [use_case_id, summary, required_fields]
      properties:
        use_case_id:
          type: string
          enum: [UC-H, UC-J, UC-K]
        summary:
          type: string
        required_fields:
          type: object
        urgency:
          type: string
          enum: [normal, high, critical]
        customer_identifiers:
          type: object
    per_uc_required_fields:
      UC-H:
        required: [ad_id_or_listing_url, registered_email, stated_reason_or_context]
        queue_candidate: Ad Moderation / Appeal queue
      UC-J:
        required: [report_target, report_type, description]
        optional: [contacted_police, evidence_references]
        queue_candidate: Trust & Safety queue
      UC-K:
        required: [platform, repro_steps_or_error_message]
        optional: [browser_or_app_version, screenshot_reference]
        queue_candidate: Technical Support queue
    output_schema:
      type: object
      required: [creation_status]
      properties:
        creation_status:
          type: string
          enum: [created, blocked, failed]
        case_id:
          type: string
        queue:
          type: string
    concrete_api_dependencies:
      - endpoint: Salesforce REST API POST /services/data/vXX.0/sobjects/Case
        service: salesforce
        purpose: case creation
      - endpoint: Salesforce Assignment Rules / Omni-Channel queue
        service: salesforce
        purpose: queue routing
    failure_modes:
      - required_fields_missing
      - policy_blocked
      - salesforce_case_api_failed
    runtime_policy:
      model_direct_invocation_allowed: false
      must_validate_required_fields: true
      must_follow_use_case_policy: true

  # ---- 7. lookup_customer_account ----
  - tool_name: lookup_customer_account
    display_name: Lookup Customer Account
    visibility: runtime_only
    phase: V1
    tool_class: trusted_read
    risk_tier: medium
    purpose: >
      Lookup customer account state using email, phone, or account_id.
      Called internally by get_customer_context.
    allowed_use_cases: [UC-C, UC-D, UC-FP, UC-K]  # v0.2.1: added UC-C (messaging diagnostic needs account restriction check)
    disallowed_use_cases: [UC-G, UC-I, UC-J]
    input_schema:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        account_id:
          type: string
    output_schema:
      type: object
      properties:
        account_id:
          type: string
        user_id:
          type: string
        account_status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED, COLLECTION_AGENCY]
        restriction_flags:
          type: array
          items:
            type: string
        blacklist_status:
          type: object
          properties:
            is_blacklisted:
              type: boolean
            reason:
              type: string
        known_good:
          type: boolean
        last_login_date:
          type: string
          format: date-time
        safe_summary:
          type: string
    concrete_api_call_chain:
      - step: 1
        endpoint: GET /api/emails/{email}/user
        service: bapi-server
        purpose: email to user/account resolution
      - step: 1a
        endpoint: GET /users/{email}/user
        service: user-service
        purpose: fallback user lookup
      - step: 2
        endpoint: GET /api/accounts/{accountId}
        service: bapi-server
        purpose: account details
      - step: 3
        endpoint: GET /api/users/{id}/known-good
        service: gumshield-api
        purpose: trust status
      - step: 4
        endpoint: POST /api/blacklists/email/check
        service: gumshield-api
        purpose: blacklist check
      - step: 5
        endpoint: GET /users/last-logged-in/{userId}
        service: user-service
        purpose: last login date
    runtime_policy:
      used_by: [get_customer_context]
      agent_direct_invocation_allowed: false

  # ---- 8. lookup_listing_or_ad ----
  - tool_name: lookup_listing_or_ad
    display_name: Lookup Listing or Ad
    visibility: runtime_only
    phase: V1
    tool_class: trusted_read
    risk_tier: medium
    purpose: >
      Lookup listing/ad state including moderation status and review reason.
      Called internally by get_customer_context. Now also invokes
      get_moderation_review_context for UC-A/UC-FP.
    allowed_use_cases: [UC-A, UC-C, UC-FP, UC-K]  # v0.2.1: added UC-C (messaging diagnostic needs ad status check)
    disallowed_use_cases: [UC-G, UC-I, UC-J]
    input_schema:
      type: object
      properties:
        listing_id:
          type: string
        ad_id:
          type: string
        phone:
          type: string
        account_id:
          type: string
    output_schema:
      type: object
      properties:
        ad_id:
          type: string
        listing_status:
          type: string
        moderation_status:
          type: string
        visibility_reason:
          type: string
        moderation_review_reason:
          type: string
        deletion_reason_code:
          type: string
        known_good:
          type: boolean
        category:
          type: string
        location:
          type: string
        safe_summary:
          type: string
    concrete_api_call_chain:
      - step: 1
        endpoint: GET /api/adverts/{id}
        service: bapi-server
        purpose: ad details
      - step: 1a
        endpoint: GET /api/adverts/by-advert-id/{advert-id}
        service: advert-service
        purpose: alternative lookup
      - step: 2
        endpoint: GET /api/adverts/{id}/features
        service: bapi-server
        purpose: paid features
      - step: 3
        endpoint: GET /api/adverts/status/{id}
        service: gumshield-api
        purpose: moderation status
      - step: 4
        endpoint: GET /api/adverts/{id}/known-good
        service: gumshield-api
        purpose: trust status
      - step: 5
        endpoint: POST /api/cs-review/ad-id/
        service: gumshield-api
        purpose: moderation review reason (v0.2 new)
      - step: 6
        endpoint: GET /api/advert/{advertId}
        service: livead-search
        purpose: search index state
    runtime_policy:
      used_by: [get_customer_context]
      agent_direct_invocation_allowed: false

  # ---- 9. get_moderation_review_context (NEW in v0.2) ----
  - tool_name: get_moderation_review_context
    display_name: Get Moderation Review Context
    visibility: runtime_only
    phase: V1
    tool_class: trusted_read
    risk_tier: medium
    purpose: >
      Retrieve ad moderation/review history and deletion reason from
      gumshield cs-review. Provides grounded factual basis for UC-FP
      (explain why ad was removed) and UC-A (explain visibility).
      Called internally by lookup_listing_or_ad.
    allowed_use_cases: [UC-A, UC-FP]
    disallowed_use_cases: [UC-G, UC-H, UC-I, UC-J, UC-K]
    motivation: >
      UC-FP is highest volume UC (17.3%). Without specific deletion reason,
      Bot can only give generic "policy violation" — low containment.
      gumshield cs-review API exists as read-only queries.
    input_schema:
      type: object
      required: [ad_id]
      properties:
        ad_id:
          type: string
        review_type:
          type: string
          enum: [latest, by_reason, all]
          default: latest
    output_schema:
      type: object
      properties:
        has_review:
          type: boolean
        review_reason:
          type: string
        reason_code:
          type: string
        review_date:
          type: string
          format: date-time
        reviewer_type:
          type: string
          enum: [automatic, manual]
        safe_summary:
          type: string
    concrete_api_call_chain:
      - step: 1
        endpoint: POST /api/cs-review/latest/
        service: gumshield-api
        purpose: latest review decision
      - step: 2
        endpoint: POST /api/cs-review/ad-id/
        service: gumshield-api
        purpose: review records by ad ID
      - step: 3
        endpoint: POST /api/cs-review/id-by-reason/
        service: gumshield-api
        purpose: review records by reason
      - step: 4
        endpoint: GET /api/ad-screen-items/advert/{advert-id}
        service: gumshield-rules
        purpose: triggered screening rules
    runtime_policy:
      agent_direct_invocation_allowed: false
      used_by: [lookup_listing_or_ad]
      must_minimize_pii: true
      must_return_safe_summary_only: true
      must_map_reason_to_public_policy: true

  # ---- 10. get_message_moderation_context (NEW in v0.2.1) ----
  - tool_name: get_message_moderation_context
    display_name: Get Message Moderation Context
    visibility: runtime_only
    phase: V1
    tool_class: trusted_read
    risk_tier: medium
    purpose: >
      Check whether a user's recent messages have been blocked or flagged
      by platform message moderation. Provides grounded factual basis for
      UC-C messaging diagnostic: distinguish "messages delivered normally,
      waiting for seller reply" vs "messages blocked by moderation filters".
      Called internally by get_customer_context when active_use_case = UC-C.
    allowed_use_cases: [UC-C]
    disallowed_use_cases: [UC-A, UC-B, UC-D, UC-E, UC-F, UC-FP, UC-G, UC-H, UC-I, UC-J, UC-K]
    motivation: >
      UC-C "can't receive replies" is a common support scenario (case 570Q5000008oMIVIA2).
      Human agents check account restrictions + ad status + message moderation history.
      Without message moderation check, Bot has a diagnostic blind spot — it can confirm
      account and ad are fine but cannot rule out message-level blocks.
      message-moderation-history API exists as read-only search queries.
    input_schema:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: "User email (from form_context)"
        conversation_id:
          type: string
          description: "Optional — specific conversation if user provides ad_id"
        lookback_days:
          type: integer
          default: 7
          description: "How many days back to search"
    output_schema:
      type: object
      properties:
        has_blocked_messages:
          type: boolean
        blocked_count:
          type: integer
          description: "Number of blocked messages in lookback period"
        latest_block_reason:
          type: string
          description: "Moderation reason for most recent blocked message"
        moderation_decision:
          type: string
          enum: [VALID, BLOCKED, PENDING, UNKNOWN]
        safe_summary:
          type: string
          description: "Redacted summary for context projection"
    concrete_api_call_chain:
      - step: 1
        endpoint: POST /history/moderation/search
        service: message-moderation-history
        purpose: search for blocked messages by user email
        filter_example: "field=EMAIL, value={email}; field=STATUS, operator=EQ, value=BLOCKED"
      - step: 2
        endpoint: POST /history/moderation/search
        service: message-moderation-history
        purpose: optional — search by specific conversation
        filter_example: "field=CONVERSATION_ID, value={conversation_id}"
    runtime_policy:
      agent_direct_invocation_allowed: false
      used_by: [get_customer_context]
      must_minimize_pii: true
      must_return_safe_summary_only: true
      retry_on_failure: true

