  - name: form_context_ingestion
    type: session_init
    purpose: >
      Parse pre-chat form data at INIT stage. Write email/ad_id/description/
      topic_subject into session state. Auto-trigger get_customer_context
      when email is available.
    trigger: session_start
    inputs: [first_name, last_name, email, topic_subject, ad_id_number, description]

  - name: tool_policy_enforcer
    type: runtime_guard
    purpose: >
      Check active_use_case in tool.allowed_use_cases before every tool call.
      Return scope_blocked on violation.
    enforcement: hard_block_with_event_log

  - name: progress_placeholder
    type: ux_enhancement
    purpose: >
      Send "One moment while I look into this" message when tool call
      latency exceeds 1.5s threshold.
    threshold_ms: 1500

