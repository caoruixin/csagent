schema_version: '0.1'
spec_type: customer_service_agent_tool_spec
project:
  name: Gumtree Customer Service Live Chat Bot
  channel: salesforce_enhanced_chat_web
  phase: V1
principles:
  tool_surface_strategy: small_and_strong
  agent_pattern: single_agent_bounded_loop
  grounding_policy: grounded_before_generative
  escalation_policy: escalation_is_first_class
  sensitive_write_actions: human_only_or_phase2
use_cases:
- UC-A
- UC-B
- UC-C
- UC-D
- UC-E
- UC-F
- UC-FP
- UC-G
- UC-H
- UC-I
- UC-J
- UC-K
tools:
- tool_name: search_knowledge
  display_name: Search Knowledge
  visibility: agent_visible
  phase: V1
  tool_class: knowledge_retrieval
  risk_tier: low
  purpose: Search Salesforce Knowledge / Help Centre and return grounded candidate
    sources for the active use case.
  allowed_use_cases:
  - UC-A
  - UC-B
  - UC-C
  - UC-D
  - UC-E
  - UC-F
  - UC-FP
  disallowed_use_cases:
  - UC-G
  - UC-H
  - UC-I
  - UC-J
  trigger_examples:
  - user asks how to do something
  - user asks why an ad is not visible
  - user asks for policy or process explanation
  - bot needs a grounded FAQ answer before responding
  input_schema:
    type: object
    required:
    - query
    - use_case_id
    properties:
      query:
        type: string
        description: Search query derived from user issue.
      use_case_id:
        type: string
        enum:
        - UC-A
        - UC-B
        - UC-C
        - UC-D
        - UC-E
        - UC-F
        - UC-FP
      customer_locale:
        type: string
        description: Locale for knowledge lookup.
        default: en_GB
      top_k:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
      knowledge_scope:
        type: array
        items:
          type: string
        description: Optional allowed categories or collections for retrieval.
  output_schema:
    type: object
    required:
    - results
    - faq_miss
    properties:
      results:
        type: array
        items:
          type: object
          required:
          - source_id
          - title
          - snippet
          - canonical_url
          - score
          properties:
            source_id:
              type: string
            title:
              type: string
            snippet:
              type: string
            canonical_url:
              type: string
            score:
              type: number
            source_type:
              type: string
              enum:
              - salesforce_knowledge
              - help_centre
              - approved_git_doc
      faq_miss:
        type: boolean
      retrieval_trace:
        type: object
  candidate_api_mapping:
  - knowledge_vector_search
  - salesforce_knowledge_metadata_lookup
  - optional_reranker
  failure_modes:
  - no_results
  - low_confidence_results
  - knowledge_backend_timeout
  - scope_blocked
  runtime_policy:
    max_retries: 1
    on_no_results: allow_clarification_or_escalate
    must_log_article_candidates: true
- tool_name: resolve_article
  display_name: Resolve Article
  visibility: agent_visible
  phase: V1
  tool_class: knowledge_resolution
  risk_tier: low
  purpose: Convert candidate knowledge results into a customer-safe article package
    with title, concise summary, canonical link, and usage boundary.
  allowed_use_cases:
  - UC-A
  - UC-B
  - UC-C
  - UC-D
  - UC-E
  - UC-F
  - UC-FP
  disallowed_use_cases:
  - UC-G
  - UC-H
  - UC-I
  - UC-J
  trigger_examples:
  - after search_knowledge returns candidates
  - before bot shows an article
  - when response needs grounded summary plus link
  input_schema:
    type: object
    required:
    - source_ids
    - use_case_id
    properties:
      source_ids:
        type: array
        items:
          type: string
        minItems: 1
        maxItems: 5
      use_case_id:
        type: string
        enum:
        - UC-A
        - UC-B
        - UC-C
        - UC-D
        - UC-E
        - UC-F
        - UC-FP
      summary_style:
        type: string
        enum:
        - concise
        - standard
        default: concise
  output_schema:
    type: object
    required:
    - resolved_articles
    properties:
      resolved_articles:
        type: array
        items:
          type: object
          required:
          - source_id
          - title
          - summary
          - canonical_url
          properties:
            source_id:
              type: string
            title:
              type: string
            summary:
              type: string
            canonical_url:
              type: string
            safe_to_show:
              type: boolean
            usage_boundary:
              type: string
      article_shown_log_payload:
        type: object
  candidate_api_mapping:
  - knowledge_article_resolver
  - canonical_link_builder
  - citation_formatter
  failure_modes:
  - invalid_source_id
  - article_not_public
  - summary_generation_blocked
  runtime_policy:
    must_track_article_shown: true
    customer_output_pattern: title_plus_1_to_3_sentence_summary_plus_link
- tool_name: get_customer_context
  display_name: Get Customer Context
  visibility: agent_visible
  phase: V1
  tool_class: composite_context_read
  risk_tier: medium
  purpose: Read minimum necessary customer, account, and listing context from trusted
    systems and return a safe structured summary.
  allowed_use_cases:
  - UC-A
  - UC-C
  - UC-D
  - UC-F
  - UC-FP
  - UC-K
  disallowed_use_cases:
  - UC-G
  - UC-I
  - UC-J
  trigger_examples:
  - user provides email and asks account-related question
  - user provides ad ID / listing ID for listing visibility issue
  - bot needs authoritative context before answering or escalating
  input_schema:
    type: object
    required:
    - context_type
    properties:
      context_type:
        type: string
        enum:
        - account
        - listing
        - combined
      email:
        type: string
      phone:
        type: string
      account_id:
        type: string
      listing_id:
        type: string
      ad_id:
        type: string
      use_case_id:
        type: string
  output_schema:
    type: object
    required:
    - safe_summary
    properties:
      safe_summary:
        type: string
      account_context:
        type: object
        properties:
          account_status:
            type: string
          restriction_flags:
            type: array
            items:
              type: string
          identity_match_confidence:
            type: number
      listing_context:
        type: object
        properties:
          listing_status:
            type: string
          moderation_status:
            type: string
          visibility_reason:
            type: string
      missing_identifiers:
        type: array
        items:
          type: string
  candidate_api_mapping:
  - lookup_customer_account
  - lookup_listing_or_ad
  - phone_reverse_lookup_optional
  failure_modes:
  - identifier_missing
  - no_matching_record
  - multiple_matches
  - backend_timeout
  - permission_denied
  runtime_policy:
    must_minimize_pii: true
    must_return_safe_summary_only: true
    should_prompt_for_identifiers_when_missing: true
- tool_name: request_handover
  display_name: Request Handover
  visibility: agent_visible
  phase: V1
  tool_class: controlled_write_action
  risk_tier: medium
  purpose: Escalate the conversation to a human queue with structured handover payload
    and customer-visible next-step messaging.
  allowed_use_cases:
  - UC-A
  - UC-B
  - UC-C
  - UC-D
  - UC-E
  - UC-F
  - UC-FP
  - UC-G
  - UC-H
  - UC-I
  - UC-J
  - UC-K
  disallowed_use_cases: []
  trigger_examples:
  - user explicitly requests human
  - faq miss threshold exceeded
  - high-risk or out-of-scope issue detected
  - customer frustration or negative sentiment
  input_schema:
    type: object
    required:
    - primary_use_case
    - summary
    - escalation_reason
    properties:
      primary_use_case:
        type: string
      candidate_use_cases:
        type: array
        items:
          type: string
      intent_confidence:
        type: number
      summary:
        type: string
      customer_answers:
        type: object
      articles_shown:
        type: array
        items:
          type: string
      identifiers:
        type: object
      escalation_reason:
        type: string
      case_id:
        type: string
  output_schema:
    type: object
    required:
    - handover_status
    properties:
      handover_status:
        type: string
        enum:
        - queued
        - transferred
        - failed
      queue:
        type: string
      handover_id:
        type: string
      customer_next_step_message:
        type: string
  candidate_api_mapping:
  - route_to_queue
  - persist_handover_payload
  - salesforce_omni_transfer
  failure_modes:
  - queue_unavailable
  - handover_contract_invalid
  - transfer_api_failure
  runtime_policy:
    must_preserve_same_thread: true
    must_include_structured_summary: true
    must_log_escalation_reason: true
- tool_name: record_outcome
  display_name: Record Outcome
  visibility: agent_visible
  phase: V1
  tool_class: analytics_trace
  risk_tier: low
  purpose: Record session outcome, shown articles, escalation reason, and trace metadata
    for reporting and evaluation.
  allowed_use_cases:
  - UC-A
  - UC-B
  - UC-C
  - UC-D
  - UC-E
  - UC-F
  - UC-FP
  - UC-G
  - UC-H
  - UC-I
  - UC-J
  - UC-K
  disallowed_use_cases: []
  trigger_examples:
  - bot finishes a resolved session
  - handover is completed
  - session is closed or abandoned
  input_schema:
    type: object
    required:
    - session_id
    - outcome
    - use_case_id
    properties:
      session_id:
        type: string
      outcome:
        type: string
        enum:
        - resolved
        - escalated
        - abandoned
        - wrong_containment
        - over_escalation
      use_case_id:
        type: string
      articles_shown:
        type: array
        items:
          type: string
      escalation_reason:
        type: string
      trace_metadata:
        type: object
  output_schema:
    type: object
    required:
    - status
    properties:
      status:
        type: string
        enum:
        - ok
        - failed
  candidate_api_mapping:
  - trace_event_sink
  - session_outcome_store
  - analytics_pipeline
  failure_modes:
  - analytics_sink_unavailable
  - trace_write_failed
  runtime_policy:
    must_be_called_on_close_or_escalation: true
- tool_name: create_case_controlled
  display_name: Create Case (Controlled)
  visibility: runtime_only
  phase: V1_limited
  tool_class: controlled_write_action
  risk_tier: high
  purpose: Create a Salesforce Case for explicitly allowed categories when required
    fields are present and policy permits persistence.
  allowed_use_cases:
  - UC-H
  - UC-J
  - UC-K
  disallowed_use_cases:
  - UC-A
  - UC-B
  - UC-C
  - UC-D
  - UC-E
  - UC-F
  - UC-FP
  trigger_examples:
  - runtime policy requires case creation before handover
  - structured report intake for safety or moderation review
  input_schema:
    type: object
    required:
    - use_case_id
    - summary
    - required_fields
    properties:
      use_case_id:
        type: string
      summary:
        type: string
      required_fields:
        type: object
      urgency:
        type: string
      customer_identifiers:
        type: object
  output_schema:
    type: object
    required:
    - creation_status
    properties:
      creation_status:
        type: string
        enum:
        - created
        - blocked
        - failed
      case_id:
        type: string
      queue:
        type: string
  candidate_api_mapping:
  - salesforce_case_create
  - queue_assignment_policy
  - case_context_persistence
  failure_modes:
  - required_fields_missing
  - policy_blocked
  - salesforce_case_api_failed
  runtime_policy:
    model_direct_invocation_allowed: false
    must_validate_required_fields: true
    must_follow_use_case_policy: true
- tool_name: lookup_customer_account
  display_name: Lookup Customer Account
  visibility: runtime_only
  phase: V1
  tool_class: trusted_read
  risk_tier: medium
  purpose: Lookup customer account state using minimum identifiers such as email or
    phone.
  allowed_use_cases:
  - UC-D
  - UC-FP
  - UC-K
  disallowed_use_cases:
  - UC-G
  - UC-I
  - UC-J
  input_schema:
    type: object
    required: []
    properties:
      email:
        type: string
      phone:
        type: string
      account_id:
        type: string
  output_schema:
    type: object
    properties:
      account_status:
        type: string
      restriction_flags:
        type: array
        items:
          type: string
      safe_summary:
        type: string
  candidate_api_mapping:
  - account_lookup_api
  runtime_policy:
    used_by:
    - get_customer_context
    agent_direct_invocation_allowed: false
- tool_name: lookup_listing_or_ad
  display_name: Lookup Listing or Ad
  visibility: runtime_only
  phase: V1
  tool_class: trusted_read
  risk_tier: medium
  purpose: Lookup listing/ad state using ad ID, listing ID, phone, or linked account
    context.
  allowed_use_cases:
  - UC-A
  - UC-FP
  - UC-K
  disallowed_use_cases:
  - UC-G
  - UC-I
  - UC-J
  input_schema:
    type: object
    required: []
    properties:
      listing_id:
        type: string
      ad_id:
        type: string
      phone:
        type: string
      account_id:
        type: string
  output_schema:
    type: object
    properties:
      listing_status:
        type: string
      moderation_status:
        type: string
      visibility_reason:
        type: string
      safe_summary:
        type: string
  candidate_api_mapping:
  - listing_lookup_api
  runtime_policy:
    used_by:
    - get_customer_context
    agent_direct_invocation_allowed: false
- tool_name: moderation_enforcement_action
  display_name: Moderation Enforcement Action
  visibility: human_only
  phase: Phase2_or_manual_only
  tool_class: sensitive_write_action
  risk_tier: critical
  purpose: Perform high-risk moderation or account enforcement actions such as removing
    ads, restricting numbers, or maintaining account restriction.
  allowed_use_cases:
  - UC-H
  - UC-J
  disallowed_use_cases:
  - UC-A
  - UC-B
  - UC-C
  - UC-D
  - UC-E
  - UC-F
  - UC-FP
  - UC-G
  - UC-I
  - UC-K
  input_schema:
    type: object
    required:
    - target_id
    - action_type
    - reason_code
    properties:
      target_id:
        type: string
      action_type:
        type: string
      reason_code:
        type: string
      operator_context:
        type: object
  output_schema:
    type: object
    properties:
      action_status:
        type: string
      audit_id:
        type: string
  candidate_api_mapping:
  - ad_removal_api
  - account_restriction_api
  - number_restriction_api
  runtime_policy:
    agent_direct_invocation_allowed: false
    bot_direct_invocation_allowed: false
    requires_human_authorization: true
- tool_name: send_followup_email_or_async_update
  display_name: Send Follow-up Email or Async Update
  visibility: human_only
  phase: V1_1_or_manual_only
  tool_class: async_notification
  risk_tier: medium
  purpose: Send email or async status update after investigation or handover when
    business process requires off-thread follow-up.
  allowed_use_cases:
  - UC-G
  - UC-H
  - UC-I
  - UC-J
  - UC-K
  disallowed_use_cases: []
  input_schema:
    type: object
    required:
    - recipient_email
    - template_id
    - summary
    properties:
      recipient_email:
        type: string
      template_id:
        type: string
      summary:
        type: string
      case_id:
        type: string
  output_schema:
    type: object
    properties:
      send_status:
        type: string
      notification_id:
        type: string
  candidate_api_mapping:
  - email_notification_service
  - case_followup_workflow
  runtime_policy:
    bot_direct_invocation_allowed: false
    default_phase1_owner: human_or_backoffice
api_mapping_notes:
  agent_visible_tools_should_map_to_composite_services: true
  runtime_only_tools_should_hide_platform_specific_complexity: true
  sensitive_write_actions_should_not_be_exposed_to_phase1_bot: true
open_decisions:
- final queue routing table by use case and operating hours
- case creation allowed categories and required field contract
- trusted API source for account and listing lookup
- knowledge allowlist governance
