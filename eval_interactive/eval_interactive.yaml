bot:
  # Env-var indirection (Sprint 56 / S-Auto-3 OQ-S56.1): the autoloop
  # applier spawns a parallel Spring on a free alt port and sets
  # CSAGENT_BACKEND_URL=http://127.0.0.1:<alt-port> before invoking
  # `eval-interactive run`. For standalone (human) eval-interactive
  # usage, set CSAGENT_BACKEND_URL=http://localhost:8080 in
  # `.env.local` (the dotenv loader at eval_interactive/eval_interactive/config.py
  # reads repo-root `.env.local` automatically).
  base_url: ${CSAGENT_BACKEND_URL}

llm:
  base_url: ${SIMULATOR_BASE_URL}
  api_key: ${SIMULATOR_API_KEY}
  model: ${SIMULATOR_MODEL}
  temperature: 0.0
  # OQ-S65.8: deterministic simulator. Default was 0.7 → bad_cases ranged
  # 6/4/5 at bot temp=0; attribution analysis showed remaining variance
  # came from moonshot simulator non-determinism + session-start flakiness.
  # Set to 0.0 to remove the simulator-side variance source so candidate
  # fitness signal in the autoloop is not noise-dominated.
  simulator_temperature: 0.0

# WS-5 item 3: the L3 LLM judge gets its own provider/model so the graded
# party, the simulated customer and the grader are three different models
# (bot=deepseek-v4-flash | simulator=qwen-plus | judge=kimi-k2.6) and the
# judge's errors are not correlated with the simulator's by construction.
# Any field left empty (i.e. the JUDGE_* env var is unset) falls back to the
# `llm` section above with a WARNING — see config.resolve_judge_config — so
# an environment without JUDGE_* still runs, exactly as it did before.
judge:
  base_url: ${JUDGE_BASE_URL}
  api_key: ${JUDGE_API_KEY}
  model: ${JUDGE_MODEL}
  # Grading stays deterministic. Leave unset to inherit llm.temperature.
  temperature: 0.0

simulator:
  max_turns: 15
  default_persona:
    frustration_level: none
    verbosity: normal
    drift_behavior: none

stall_detector:
  promise_patterns:
    - "let me (check|look|find|verify|search)"
    - "i('m| am) (checking|looking|searching|investigating)"
    - "one moment"
    - "i'll (look into|check|investigate|find)"
    - "thanks for your patience"
    - "just a moment"
  followup_window_turns: 2

batch:
  # parallel=1 default aligned with dataclass default at config.py:85 per
  # S-Cleanup-1 close (2026-05-23) OQ-S47.1 disposition; M3-Eval close
  # evidence supports sequential runs for bad-case suite stability.
  parallel: 1
  timeout_per_session_seconds: 120

report:
  output_dir: results/
