bot:
  base_url: http://localhost:8080

llm:
  # Values resolved from env vars at runtime
  base_url: ${DASHSCOPE_BASE_URL}
  api_key: ${DASHSCOPE_API_KEY}
  model: ${DASHSCOPE_CHAT_MODEL}
  temperature: 0.0
  simulator_temperature: 0.7

simulator:
  max_turns: 15
  default_persona:
    frustration_level: none
    verbosity: normal
    drift_behavior: none

stall_detector:
  promise_patterns:
    - "let me (check|look|find|verify|search)"
    - "i('m| am) (checking|looking|searching|investigating)"
    - "one moment"
    - "i'll (look into|check|investigate|find)"
    - "thanks for your patience"
    - "just a moment"
  followup_window_turns: 2

batch:
  parallel: 5
  timeout_per_session_seconds: 120

report:
  output_dir: results/
