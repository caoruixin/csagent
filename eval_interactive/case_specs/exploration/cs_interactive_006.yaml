  frustration_level: high
  verbosity: verbose
  drift_behavior: hard_shift
  seed_messages:
  - Why are there no details or information on your website about how to raise a return and request a refund?
  - You have accepted that a customer has not received the item they paid for and instead of simply refunding your end, you
    have tried to disguise poor systems as a process that I must follow. No I don't need to wait. The proof of delivery is
    visible. You have even checked it. So you can't expect a customer to wait on your business.
  - If you are not in the UK then I suggest you call someone who is because right now you are representing Gumtree and the
    UK law and legislation applies.
  hidden_facts: []
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: escalate
