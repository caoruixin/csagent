  description: Parcel lost
persona:
  user_goal_summary: 'User is a seller on Gumtree who shipped an item via Evri, and it got lost. They want to know if they
    must refund the buyer, and what steps to take. Drift: hard_shift.'
  frustration_level: high
  verbosity: verbose
  drift_behavior: hard_shift
  seed_messages:
  - Good morning, I sold an item on Gumtree and posted it through Evri. The parcel seems to be lost. My question is, am I
    as the seller liable to refund the purchase? I did tell the buyer that I will use Standard delivery only, before he bought
    it. Maybe you can tell me what the right thing is to do.
  - The id is 1507513803, thank you!
  - The package was not received. I sent it on 14/12 and still shows it is with Evri
  hidden_facts: []
  will_request_human_if: ''
expected:
  outcome_class: escalate
  primary_uc: UC-I
  secondary_ucs:
  - UC-B
  should_escalate: true
  allow_bot_resolution: 'false'
  bot_handling_pattern: Acknowledge the issue, run policy-mandated tools (request_handover, record_outcome), collect required
    intake fields (registered_email, ad_id_or_order_reference, brief_description), and hand over with reason payment_dispute_detected.
  escalation_trigger: payment_dispute_detected
  risk_level: high
  expected_tool_sequence:
  - request_handover
  - record_outcome
  forbidden_tools:
