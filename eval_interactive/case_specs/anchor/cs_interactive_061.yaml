case_id: cs_interactive_061
source_session_id: 570Q5000008i6JdIAI
source_dataset: escalation
form_context:
  first_name: Charlène
  email: customer@example.com
  topic_subject: Account Support
  ad_id: ''
  description: I can’t send messages to reply to ads
persona:
  user_goal_summary: 'User is unable to reply to ads on Gumtree, preventing her from answering flat listings. She also wants
    to correct the automatically linked email address that is not hers. Drift: soft_shift.'
  frustration_level: high
  verbosity: verbose
  drift_behavior: soft_shift
  seed_messages:
  - It’s for all the ads, each time I try to reply to an ad it won’t let me. I am looking for a flat and unable to answer
    ads of other people. I didn’t post an ad myself
  - I think it’s an email that has been linked automatically to my account but it’s not my email address
  hidden_facts: []
  will_request_human_if: ''
closure_criterion: |
  Two-stage closure (WS-2, 2026-07-25). This is a MIXED ask: part of it is an
  explanation / read-only status query on the user's own data, and part of it requires the
  platform to modify data. The halves are judged in order.

  STAGE 1 (mandatory, must come first):
    Bot troubleshoots and EXPLAINS the read-only half: why replying to ads is failing (reply-flow
    FAQ grounded in a Help Centre article) and, via get_customer_context, which email address is
    actually on the account. Bot does not lock the whole session onto the email-ownership
    complaint before answering the reply-failure question the user opened with.

  STAGE 2 (conditional, only after Stage 1):
    If the user needs an email address that is not theirs REMOVED from the account — a credential-
    class data modification, and a possible account-integrity issue — a handover is correct.

  FAIL: any handover that happens before Stage 1 has been delivered, including a turn-0
  handover; and any handover with no closure-qualified grounded-help marker. Enforced
  declaratively by the conditional_outcome_acceptance block
  (require_closure_precondition: true), not by a flat resolve-or-escalate acceptance.

expectation_revision_note: |
  2026-07-25 (WS-2, replan rev 2 §3 WS-2; coordinator adjudication of the
  "待裁决 / undecided" list). This spec was one of 6 anchor cases held back from
  the escalate -> resolve flip because the ask is MIXED. The adjudication: mixed
  asks are not a reason to keep a flat expectation — they are exactly the shape
  that needs the two-stage rule, the same treatment applied to the item-B cases
  `wmkb_uc_a_trader_flag_secondary_uc_h`, `cs095_uc_d_email_recovery_misroute`
  and `iwzx_uc_k_advert_on_hold_restore`.

  The mixed ask here: the user cannot reply to any ads, AND separately reports that an email address which is not theirs has been automatically linked to their account.

  Why the previous label was wrong on its own terms (replan rev 2 §1.1 A1): the
  generator read "a human agent took this session over" out of the historical
  transcript and stamped this FAQ-resolvable UC as `escalate`. The corpus is by
  construction sessions that reached a human, so the regex in
  `case_spec/transcript_evidence.py:146-208` fires on nearly every one. This spec
  was simultaneously `should_escalate: true` and `allow_bot_resolution: 'true'` —
  the policy table said the bot MAY resolve this UC while the spec demanded a
  handover. But a straight flip to `resolve` would have been equally wrong here,
  because half of this ask genuinely does require the platform to modify data.

  Product principle applied (product owner, 2026-07-25), for mixed asks: answer
  the explanation / read-only-status half FIRST, then the data-modification half
  may go to a human. Read-only status query on the user's own data was promoted
  into current scope by product decision D1 (replan rev 2 §2).

  Mechanism: the declarative `conditional_outcome_acceptance` block below
  (`scoring/conditional_outcome.py`, introduced by S-Auto-40 WP1-A). Semantics
  per `conditional_outcome.py:232-281`:
    * SATISFIED customer + `resolve` -> PASS.
    * positively-UNRESOLVED-after-help + `escalate` + the closure-qualified
      grounded-help marker required by `require_closure_precondition: true`
      (a bot turn carrying tool calls AND non-empty `source_ids` AND a grounded
      answer) -> CONDITIONAL_ELIGIBLE, promoted to PASS only by a committed
      per-trace adjudication in
      `case_specs/conditional_outcome_adjudications.yaml`.
    * `escalate` with user_state UNKNOWN or SATISFIED, or with NO grounded-help
      marker — i.e. the bot handed over without first answering the read-only
      half — -> FAIL.
  This is a tightening, not a §5.4 widen: `escalate` used to score 1.0
  unconditionally on this spec, and now scores 0.0 unless the read-only half was
  delivered first and the customer is positively still unresolved.

  Verified (the trap found on cs095 / iwzx): `correct_outcome` is present in
  `scoring.outcome_checks` below, so the block is actually evaluated — the
  conditional evaluator is only reachable from inside `_check_correct_outcome`
  (`scoring/outcome_checks.py:237`), and an empty `outcome_checks` list would
  have made this whole rule inert.

  Mechanical consequences, all forced by the schema / linter:
    * `should_escalate: false` and `escalation_trigger: null` (schema.py
      Expected.__post_init__ rejects a trigger when should_escalate is false;
      linter R4 does the same). The escalate path is now CONDITIONED, not
      removed.
    * `outcome_class: resolve` — the conditional block's `satisfied_outcome`,
      and required by linter R1 for this UC.
    * `request_handover` dropped from `expected_tool_sequence`, which is
      advisory (`outcome_checks.py` tool_sequence_match is Tier-3 diagnostic);
      Stage 2 may still legitimately call it.
    * `escalation_triggered` -> `resolution_achieved` in
      `scoring.outcome_checks`, per `extractor.py:1413-1416`.
    * "I'll resolve this for you" dropped from `answer_must_not_contain` (the
      escalate-honesty phrase, added only for escalate outcomes per
      `extractor.py:1350-1352,1367-1369`; on a resolve-shaped case it is an L1
      hard-check false positive, `hard_checks.py:486-491`). The three
      capability-lie phrases are deliberately KEPT — the bot has no tool that
      can fix, send, restore, delete or ban anything (`GumtreeApiService`
      exposes four getters), so they remain true anti-fabrication guards.
    * `closure_criterion` ADDED. Anchor specs are generated without one
      (`schema.py:309` / `loader.py:105` make it Optional), but the two-stage
      rule is meaningless without a written statement of which half is Stage 1,
      and it is what the §5.6 manual review reads.

  NOT changed: primary_uc, secondary_ucs, persona, seed_messages, form_context,
  risk_level, max_turns, hard_checks, or llm_judge_dimensions.
# WS-2 2026-07-25: two-stage, condition-bound outcome acceptance for a MIXED
# ask. Stage 1 (the explanation / read-only-status half) must be delivered,
# evidenced by the closure-qualified grounded-help marker; only then may a
# handover for the data-modification half be CONDITIONAL_ELIGIBLE, and it still
# needs a committed adjudication to PASS. See expectation_revision_note.
conditional_outcome_acceptance:
  schema_version: 1
  satisfied_outcome: resolve
  unresolved_accept_outcome: escalate
  require_closure_precondition: true
expected:
  outcome_class: resolve
  primary_uc: UC-C
  secondary_ucs:
  - UC-K
  - UC-D
  - UC-B
  should_escalate: false
  allow_bot_resolution: 'true'
  bot_handling_pattern: >-
    Two-stage. Stage 1: acknowledge the issue, run policy-mandated tools (get_customer_context, search_knowledge,
    resolve_article, record_outcome) and answer the explanation / read-only-status half from the knowledge base
    and the user's own retrieved data. Stage 2: only once Stage 1 has been delivered, and only if the customer is
    positively still unresolved, hand the data-modification half over to a human. A handover before Stage 1 is a
    failure.
  escalation_trigger: null
  risk_level: low
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - record_outcome
  forbidden_tools:
  - create_case_controlled
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - resolution_achieved
  - answer_accuracy
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
