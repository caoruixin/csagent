closure_criterion: |
  The user's actual question is "which email is the right one to log in / receive
  messages with on my account?" The bot is judged closed when it either (a) walks
  the user through how to verify which email is the active one (account-settings
  path or grounded FAQ about email-on-account), or (b) escalates with a useful
  handover summary that names the dual-email confusion. Closure FAILS if the bot
  loops asking which email to use as if the answer were obvious, fabricates an
  account state, or terminates with no acknowledgement of the dual-email mismatch.
