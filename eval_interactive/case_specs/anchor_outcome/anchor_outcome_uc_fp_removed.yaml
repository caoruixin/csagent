case_id: anchor_outcome_uc_fp_removed
source_session_id: 570Q5000008WmXxIAK
source_dataset: anchor_outcome_uc_fp_removed_reuse
closure_criterion: |
  The user's ad was removed and they want to know what happened. The bot
  is judged closed when it (a) walks the user through the removal-reason
  FAQ surface with grounded info on common removal reasons + how to check
  listing status + how to appeal if applicable, OR (b) routes to a UC-H
  appeal intake if the user explicitly wants to appeal, OR (c) escalates
  with a useful handover that names the ad-removal question. Closure
  FAILS if the bot promises to "restore the ad" itself, fabricates a
  specific removal reason without retrieval, or locks the user into
  UC-H intake when the user does not yet know if they want to appeal.
form_context:
  first_name: Adam
  email: customer@example.com
  topic_subject: Ad Support
  ad_id: ''
  description: Can you tell me what happened to my ad?
persona:
  user_goal_summary: |
    User's ad is no longer visible and they want to know what happened.
    They do not yet know if they want to appeal - they first want to
    understand why the ad was removed. Cooperative; will follow guidance
    if the bot offers a clear next step.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
    - "Hi - can you tell me what happened to my ad? I can't see it anymore."
  hidden_facts: []
  will_request_human_if: bot enters a multi-turn loop without explaining why the ad was removed
expected:
  outcome_class: either
  primary_uc: UC-FP
  secondary_ucs:
    - UC-A
    - UC-H
  should_escalate: false
  allow_bot_resolution: 'partial'
scoring:
  hard_checks: []
  outcome_checks: []
  llm_judge_dimensions: []
