closure_criterion: |
  The user has a payment / delivery dispute (UC-I intake-then-escalate;
  e.g. paid for a delivery that did not arrive). The bot is judged
  closed when it (a) acknowledges the dispute in user-facing terms,
  (b) collects the required intake fields (registered email, order
  identifier or ad reference, brief description), and (c) escalates
  with a useful handover summary that names the payment dispute.
  Closure FAILS if the bot unilaterally promises a refund, asks the
  same intake field across multiple turns without progress, or
  terminates without a handover.
