  The user has a billing / payment question (UC-F charges, invoices,
  refunds for paid features). The bot is judged closed when it answers
  the actual billing question with grounded references, OR escalates with
  a useful handover that names the billing concern. Closure FAILS if the
  bot promises to "refund the charge" itself, fabricates a billing state,
  or terminates without acknowledging the billing concern.
