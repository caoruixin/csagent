  The user paid for an ad promotion (Top Ad) and the listing is not where
  they expected (not at the top, not visible, etc.). The bot is judged
  closed when it (a) answers with grounded info about how the promoted
  placement works and how long activation takes, OR (b) escalates with a
  useful handover that names the promotion-paid-but-not-visible shape.
