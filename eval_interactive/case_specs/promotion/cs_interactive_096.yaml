expectation_revision_note: |
  2026-07-26 (Sprint 106 / WS-2 continuation, replan rev 2 §3 WS-2 "Bulk: the 158
  contradictory specs need per-UC review"). WS-2 (74de32c3) took anchor/ + smoke/;
  this pass takes promotion/ + case_families/.

  Why these specs were contradictory (replan rev 2 §1.1 A1): the CaseSpec
  generator read "a human agent took this session over" out of the historical
  transcript and stamped an FAQ-resolvable UC as `escalate`. The corpus is by
  definition sessions that reached a human, so the regex in
  `case_spec/transcript_evidence.py:146-208` (via
  `case_spec/case_outcome_resolver.py:196-206`) fires on nearly every one. The
  result is a spec that is simultaneously `should_escalate: true` and
  `allow_bot_resolution: 'true'` — the policy table says the bot MAY resolve this
  UC while the spec demands it hand over. Linter R1 had a carve-out waiving
  exactly this pair until WS-1 (fb9c64ff) removed it.

  Product principle applied (product owner, 2026-07-25; replan rev 2 §2): an ask
  that requires the platform to MODIFY data (refund, remove a review, restore or
  activate a listing, unban an account, change stored credentials, cancel
  billing) is correctly escalated; an ask that is FAQ explanation, or a read-only
  status query on the user's OWN data, must be completed by the agent — decision
  D1 promoted read-only user-data status query into current scope. Decision D2
  revised "customer indicates frustration ⇒ must escalate" to "de-escalate and
  keep solving first", while keeping immediate escalation for high-risk topics
  (fraud, safety, legal).

  Adjudication (Sprint 106): Expected outcome flipped escalate -> resolve.

  The ask: the Rate Buyer option disappeared after the sale - how can the
  review still be left.

  EVIDENCE THE BOT CAN FINISH IT: the knowledge corpus article `Reviews`
  (ka4P2000000065RIAQ) states verbatim where the control lives ('Select
  Messages ... At the bottom of the conversation, click Rate Buyer/Seller'),
  that it becomes available only 'after a number of messages have been sent
  back and forth', and that a rating appears on the other account
  'immediately after they've rated you. If they don't leave a rating, it
  will appear after 5-days'. The user's `user_goal_summary` asks for exactly
  this - 'finding another way to submit the review'. That is an explanation-
  class ask with a grounded answer, so the corpus should not be teaching a
  handover here.

  Mechanical consequences of the flip, all forced by the schema / linter:
    * `should_escalate: false` and `escalation_trigger: null` — `schema.py`
      Expected.__post_init__ rejects a trigger when should_escalate is false, and
      linter R4 does the same.
    * `request_handover` dropped from `expected_tool_sequence`, and
      `bot_handling_pattern` restated from the non-escalate template
      (`case_spec/extractor.py:1332-1342`).
    * `escalation_triggered` → `resolution_achieved` in `scoring.outcome_checks`
      (`extractor.py:1413-1416`). Per `scoring/outcome_checks.py:57-63` the first
      is an alias of `escalation_timing` and the second of `correct_outcome`, so
      this stops grading escalation promptness on a case that must not escalate.
    * "I'll resolve this for you" dropped from `answer_must_not_contain`: it is
      the escalate-honesty phrase added only for escalate outcomes
      (`extractor.py:1350-1352`), and on a resolve case it is an L1 hard-check
      false positive (`hard_checks.py:486-491`). The three capability-lie phrases
      ("I've fixed" / "I have sent you an email" / "I can restore/delete/ban this
      directly") are deliberately KEPT — the bot has no tool that can do any of
      those things, so they remain true anti-fabrication guards on a resolve path.

  NOT changed: primary_uc, secondary_ucs, persona, seed_messages, hidden_facts,
  form_context, risk_level, max_turns, hard_checks, or llm_judge_dimensions.
expected:
  outcome_class: resolve
  primary_uc: UC-A
  secondary_ucs:
  - UC-H
  - UC-K
  - UC-C
  should_escalate: false
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the issue, run policy-mandated tools (get_customer_context, search_knowledge,
    resolve_article, record_outcome), and answer from the knowledge base grounded in the user's own data. Do not
    escalate.
  escalation_trigger: null
  risk_level: medium
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - record_outcome
  forbidden_tools:
  - create_case_controlled
  - get_message_moderation_context
  - lookup_customer_account
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - resolution_achieved
  - answer_accuracy
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
