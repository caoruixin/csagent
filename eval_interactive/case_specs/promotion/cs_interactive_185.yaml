expectation_revision_note: |
  2026-07-26 (Sprint 106, contract item 3 — "Fix cs_interactive_185's
  primary_uc"). VERDICT: `primary_uc` is CORRECT as UC-D. NOTHING IS CHANGED in
  this file beyond this note.

  Sprint 103 §6.6 recorded that "the spec expects UC-D (Account & Login), but
  its scripted drift in every draw is toward editing live ads (UC-A/UC-B
  territory)", flagging it for this sprint. Adjudicated on the spec's own
  evidence, as the contract requires, the UC-D pin is right and the premise is
  not supported:

  1. EVERY authored field points at Account & Login. `form_context.topic_subject`
     is "Account Support"; the form description is a browser cookie-clearing
     instruction given to regain access; `user_goal_summary` opens "User wants
     to access his Gumtree account"; and all three `seed_messages` are the
     same thread — the 4-dots/More-tools cookie path, "Trying to get access to
     my account", and the old address being blocked by Microsoft. There is no
     authored user intent to edit, post or manage an advert anywhere.

  2. The ONLY ad-related content is one `hidden_facts` entry — "The user has
     two live ads posted on their Gumtree account" — whose `disclose_when` is
     "when the bot asks about account activity or ad status". That is a REPLY
     the persona gives when questioned, not a goal it pursues. It exists to let
     the bot confirm the account is live, which is corroboration for the UC-D
     access story.

  3. The ad-shaped asks are produced by a known FRAMEWORK defect, not by this
     spec's content. Per replan rev 2 §1.4, `persona.drift_behavior` never
     reaches the model; the only thing rendered is the bare token
     `Drift: hard_shift.` appended to `user_goal_summary`
     (`case_spec/extractor.py:1144`). The simulator is told to shift without
     being told to what, and the two-live-ads `hidden_facts` entry is the only
     other material available to shift toward — so an ad-renewal / ad-recovery
     excursion is the EXPECTED output of that defect on this persona, on any
     draw. That is `infra` under §3.2 question 1, not `eval_spec`.

     WITHDRAWN ARGUMENT (recorded so the reasoning is not re-run): an earlier
     version of this note argued that "in every draw" was contradicted by
     Sprint 103 §5.2, since 2 of 3 measured draws committed UC-D throughout.
     That count is accurate but answers the wrong question — Sprint 104 §5.6's
     claim is about the ASKS THE CUSTOMER RAISED, not the UC the runtime
     committed, and in its draws those disagreed. Points 1-3 carry the verdict
     without it.

  Why the drift label is ALSO left alone. `drift_behavior: hard_shift` is
  arguably overstated — the persona's two threads (the cookie/browser block and
  the Microsoft-blocked email address) are both inside UC-D, which is a soft
  shift, not a hard one. It is deliberately NOT changed, for two reasons.
  First, the single UC-A excursion is better explained by the documented
  simulator defect than by this spec: per replan rev 2 §1.4 the
  `persona.drift_behavior` field never reaches the model at all, and the only
  thing rendered is the bare token "Drift: hard_shift." appended to
  `user_goal_summary` (`case_spec/extractor.py:1144`) — so the simulator is
  told to shift without being told to what, and the two-live-ads hidden fact is
  the only other material available to shift toward. That is an eval-framework
  defect (§3.2 question 1, `infra`), not an `eval_spec` one, and it is out of
  this sprint's contract. Second, retuning the drift class would silently
  remove this case from the drift population that Sprint 104 is measuring right
  now, on a premise its own evidence does not support — and changing a spec to
  match observed bot behaviour is the §5.4 failure mode this workstream exists
  to undo.

  FLAGGED FOR SPRINT 104: this file is byte-unchanged apart from this note, so
  no drift measurement taken against it needs re-attribution.
