  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the issue, run policy-mandated tools (get_customer_context, search_knowledge, resolve_article,
    request_handover, record_outcome), collect required intake fields (none), and hand over with reason payment_dispute_detected.
  escalation_trigger: payment_dispute_detected
  risk_level: medium
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - request_handover
  - record_outcome
