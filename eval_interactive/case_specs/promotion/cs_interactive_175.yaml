case_id: cs_interactive_175
source_session_id: 570Q5000008fMw1IAE
source_dataset: drift_control
form_context:
  first_name: Claire
  email: customer@example.com
  topic_subject: Ad Support
  ad_id: ''
  description: I can only see my old ad, and I cannot see the replies, if any, to the new ad posted yesterday. Please advise.
persona:
  user_goal_summary: 'User cannot see replies to new ad and only sees old ad in messages. Frustrated because they receive
    many replies on care.com. Wants to either find replies or cancel and get a refund. Drift: hard_shift.'
  frustration_level: high
  verbosity: verbose
  drift_behavior: hard_shift
  seed_messages:
  - How do I find the replies and why do I only see my very old ad when I click on messages?
  - Strange, as I am also on care.com and I receive three replies an hour! Perhaps I should cancel my ad with Gumtree and
    get.a refund, please, as something is not right. Thank you in advance. ctb
  hidden_facts: []
  will_request_human_if: ''
expectation_revision_note: |
  2026-07-26 (Sprint 106 / WS-2 continuation, replan rev 2 §3 WS-2 "Bulk: the 158
  contradictory specs need per-UC review"). WS-2 (74de32c3) took anchor/ + smoke/;
  this pass takes promotion/ + case_families/.

  Why these specs were contradictory (replan rev 2 §1.1 A1): the CaseSpec
  generator read "a human agent took this session over" out of the historical
  transcript and stamped an FAQ-resolvable UC as `escalate`. The corpus is by
  definition sessions that reached a human, so the regex in
  `case_spec/transcript_evidence.py:146-208` (via
  `case_spec/case_outcome_resolver.py:196-206`) fires on nearly every one. The
  result is a spec that is simultaneously `should_escalate: true` and
  `allow_bot_resolution: 'true'` — the policy table says the bot MAY resolve this
  UC while the spec demands it hand over. Linter R1 had a carve-out waiving
  exactly this pair until WS-1 (fb9c64ff) removed it.

  Product principle applied (product owner, 2026-07-25; replan rev 2 §2): an ask
  that requires the platform to MODIFY data (refund, remove a review, restore or
  activate a listing, unban an account, change stored credentials, cancel
  billing) is correctly escalated; an ask that is FAQ explanation, or a read-only
  status query on the user's OWN data, must be completed by the agent — decision
  D1 promoted read-only user-data status query into current scope. Decision D2
  revised "customer indicates frustration ⇒ must escalate" to "de-escalate and
  keep solving first", while keeping immediate escalation for high-risk topics
  (fraud, safety, legal).

  Adjudication (Sprint 106): Converted to a two-stage conditional acceptance
  (explanation half required, then handover may be accepted).

  The ask: where are the replies to the new ad, and otherwise cancel it and
  refund.

  'How do I find the replies and why do I only see my very old ad when I
  click on messages?' is a messaging-navigation explanation plus a read-only
  look at the user's own ads. The refund is conditional and second ('Perhaps
  I should cancel my ad ... and get a refund'). The bot must answer the
  first before a refund handover is accepted; today the spec rewards
  skipping straight to the handover.

  Why two-stage rather than a flip or a permissive list: a plain
  `acceptable_outcomes: [resolve, escalate]` would score 1.0 for BOTH terminals
  (`scoring/outcome_checks.py::_check_correct_outcome` takes the acceptable-set
  branch first), i.e. it would measure nothing on the axis this sprint cares
  about. The declarative `conditional_outcome_acceptance` block
  (`scoring/conditional_outcome.py`, mechanism from S-Auto-40 WP1-A) is used
  instead. Semantics per `conditional_outcome.py:232-281`:
    * bot delivers the explanation half and the customer ends SATISFIED /
      UNKNOWN with outcome `resolve` → PASS.
    * bot delivers grounded help, the customer is positively UNRESOLVED after it,
      and the bot then hands over → CONDITIONAL_ELIGIBLE (scores 0.0 and is
      surfaced for review; PASS only via a committed per-trace adjudication in
      `case_specs/conditional_outcome_adjudications.yaml`).
    * bot hands over WITHOUT a closure-qualified grounded-help marker, or after
      the customer was already SATISFIED → FAIL. That is the failure shape this
      spec previously rewarded.
  `require_closure_precondition: true` is satisfied structurally — a bot turn
  carrying tool calls AND non-empty `source_ids` AND a non-empty answer
  (`conditional_outcome.py:113-132`) — so it does not depend on this spec having
  a `closure_criterion` field.

  `correct_outcome` is present in `scoring.outcome_checks`, which is required for
  the block to be evaluated at all: the delegation lives inside
  `_check_correct_outcome` (`outcome_checks.py:227-237`), so without it the new
  rule would be inert.

  `allow_bot_resolution` is deliberately LEFT at the UC policy value rather than
  set to 'partial': linter R2 compares that field to the policy row
  (`case_spec/linter.py:253-280`), so 'partial' would trade an R1 error for an R2
  one. The per-case expectation is carried by the conditional block, not by that
  field.

  NOT changed: primary_uc, secondary_ucs, persona, seed_messages, hidden_facts,
  form_context, risk_level, max_turns, hard_checks, or llm_judge_dimensions.
# Sprint 106 2026-07-26: two-stage, condition-bound outcome acceptance.
# Stage 1 — the explanation / read-only half must be delivered, evidenced by
# the closure-qualified grounded-help marker (require_closure_precondition).
# Stage 2 — only then, and only when the customer is positively UNRESOLVED
# after that help, may the data-modifying half be handed over, and that is
# CONDITIONAL_ELIGIBLE (review-required), not a free pass.
# See expectation_revision_note above.
conditional_outcome_acceptance:
  schema_version: 1
  satisfied_outcome: resolve
  unresolved_accept_outcome: escalate
  require_closure_precondition: true
expected:
  outcome_class: resolve
  primary_uc: UC-C
  secondary_ucs:
  - UC-K
  - UC-C
  - UC-B
  should_escalate: false
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the issue, run policy-mandated tools (get_customer_context, search_knowledge,
    resolve_article, record_outcome), and answer the explanation / read-only half from the knowledge base and the
    user's own data FIRST. Only if the customer is still unresolved after that grounded help may the remaining
    data-modifying half be handed over; see conditional_outcome_acceptance.
  escalation_trigger: null
  risk_level: low
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - record_outcome
  forbidden_tools:
  - create_case_controlled
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - resolution_achieved
  - answer_accuracy
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
