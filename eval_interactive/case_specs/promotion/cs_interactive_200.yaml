  - UC-FP
  - UC-K
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the issue, run policy-mandated tools (get_customer_context, search_knowledge, resolve_article,
    request_handover, record_outcome), collect required intake fields (none), and hand over with reason faq_miss_threshold_exceeded.
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: low
  expected_tool_sequence:
