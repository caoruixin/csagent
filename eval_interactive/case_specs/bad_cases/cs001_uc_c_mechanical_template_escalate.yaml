case_id: cs001_uc_c_mechanical_template_escalate
source_session_id: 570Q5000008kr6LIAQ
source_dataset: bad_case_from_override

bad_case_metadata:
  source_session_id: 570Q5000008kr6LIAQ
  surfaced_by: Sprint 21 Wave A5/A6 L3 batch disposition (cs_interactive_001)
  surfaced_date: 2026-05-14
  failure_shape: |
    A UC-C Replies / Messaging session ("I am unable to receive messages on my account") triggers
    two failure modes layered together. (1) The pre-override CaseSpec pairs
    escalation_trigger=clarification_budget_exhausted with bot_handling_pattern naming "intake
    fields (none)" — a logical contradiction (no clarification budget exists to exhaust when no
    clarification fields are required); the truthful Phase 2 §2.4 reason is
    faq_miss_threshold_exceeded after search_knowledge + 3 × resolve_article exhausts FAQ
    without a resolve-grade hit. (2) The bot's turn-0 user-facing reply is a mechanical template
    ("Hi Benjamin! I'm having difficulty resolving this. Let me connect you with a specialist.")
    with zero acknowledgment of the user's specific complaint. This bad case captures the L3
    quality failure (the L1 escalation_trigger correction is now reflected in the override; the
    bot's behaviour quality is the still-active failure surface).
  layers_involved: prompt_projection (the LLM did not project the user's specific messaging
    complaint into a personalised acknowledgment); semantic_planner (LLM chose a generic
    template rather than running the policy-mandated FAQ search first); eval_spec (the L1
    clarification_budget_exhausted label was an internal contradiction that the override
    corrected to faq_miss_threshold_exceeded).
  related_dimensions: [D4]
  related_r_items: []
  tier: scope-relevant
  expectation_revision_note: |
    2026-07-25 (WS-2, replan rev 2 §3 WS-2 "Expectation is wrong — flip to
    resolve" / "decouple the quality complaint from the outcome"): the outcome
    expectation is revised from `escalate` to `resolve`.

    This case exists to assert a QUALITY property — that the turn-0 reply must
    not be the mechanical template "Hi Benjamin! I'm having difficulty
    resolving this. Let me connect you with a specialist." with zero
    acknowledgement of the user's actual complaint. That assertion is intact
    and is now enforced twice: in `closure_criterion` and, newly, as a hard
    check via `expected.answer_must_not_contain`.

    What was wrong is that the case ALSO pinned the terminal to `escalate`,
    conflating "the wording was bad" with "a human was needed". They are
    independent. The case's own `hidden_facts` (below) are two ordinary
    self-serve causes — email reply-notifications switched off in notification
    settings, and auto-filtered replies sitting in a hidden "blocked" folder.
    Both are answerable by explaining a setting the user controls; neither
    requires the platform to modify the user's data. Under the 2026-07-25
    product principle that makes this an agent-resolvable case, and the prior
    `escalate` label is an instance of replan §1.1 A1 (the generator read "a
    human took this session over" out of the historical transcript).

    `allow_bot_resolution` 'partial' → 'true' follows the UC-C policy row
    (`case_spec/policy_table.py:178-194`), which linter R2 requires.

    NOT changed: `primary_uc` UC-C is correct (Replies & Messaging), and the
    `failure_shape` record above is preserved verbatim.

closure_criterion: |
  OUTCOME requirement: bot RESOLVES this case. The two hidden facts are ordinary self-serve
  causes (email reply-notifications turned off; auto-filtered replies in a hidden "blocked"
  folder), so a good CS agent walks the user to the relevant setting / folder and closes the
  issue. No data modification is asked of the platform, so a handover is a FAILURE here, not a
  safe default. Bot does NOT skip FAQ search and escalate immediately, and does NOT escalate
  with reason=clarification_budget_exhausted when no clarification fields are required (a
  logical impossibility).

  QUALITY requirement (this case's original and still-primary assertion, independent of the
  outcome above): bot acknowledges the user's specific Replies / Messaging complaint by
  paraphrasing or naming the actual issue ("you can't receive messages on your account") in the
  turn-0 reply. Bot does NOT use a mechanical template ("I'm having difficulty resolving this"
  / "Let me connect you with a specialist") on turn 0 before any tool call has run, and runs the
  policy-mandated tool sequence (search_knowledge + resolve_article) before answering. A reply
  that reaches the right OUTCOME through a turn-0 mechanical template still FAILS this case.

form_context:
  first_name: Benjamin
  email: benjamin.messages@example.com
  topic_subject: Replies & Messaging
  ad_id: ''
  description: |
    I am unable to receive messages on my account. People are replying to my ads but I do not
    see any messages.

persona:
  user_goal_summary: |
    User's listings are getting replies from buyers, but the messages are not showing up in
    the user's inbox on the platform. The user wants the platform to investigate why
    messages are not being delivered. UC-C (Replies / Messaging) primary; intake-fields-none
    case; if FAQ search has no covering article, faq_miss_threshold_exceeded is the truthful
    handover reason.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
    - "I am unable to receive messages on my account. People are replying to my ads but I don't see any messages."
    - "Can you check why messages aren't getting through?"
  hidden_facts:
    - fact: User's email notifications for replies are turned off in the notification
        settings; in-app messages are working, but the user only checks email.
      disclose_when: if the bot asks whether the user checks the in-app inbox vs email notifications
    - fact: User has been receiving spam replies that the system auto-filtered into a hidden
        "blocked" folder; the user is not aware of the blocked folder.
      disclose_when: if the bot asks about spam / blocked / filter folders specifically
  will_request_human_if: the bot opens with a mechanical "I'm having difficulty resolving this"
    template before running any FAQ search

expected:
  # WS-2 2026-07-25: escalate → resolve. The quality assertion (turn-0
  # mechanical template) is decoupled from the outcome assertion and now lives
  # in closure_criterion + answer_must_not_contain below. See
  # bad_case_metadata.expectation_revision_note.
  outcome_class: resolve
  primary_uc: UC-C
  secondary_ucs: []
  should_escalate: false
  # WS-2 2026-07-25: 'partial' → 'true' per the UC-C policy row (linter R2).
  allow_bot_resolution: 'true'
  # WS-2 2026-07-25: must be null when should_escalate=false (schema post-init
  # + linter R4).
  escalation_trigger: null
  # WS-2 2026-07-25: was [escalate, resolve], which under
  # scoring/outcome_checks.py:_check_correct_outcome paid 1.0 for either
  # terminal — zero discrimination on the very axis this sprint cares about.
  acceptable_outcomes: [resolve]
  # WS-2 2026-07-25: the quality complaint, re-homed. These are enforced as an
  # L1 hard check (hard_checks.py:486-491, folded into
  # no_critical_policy_violation) so the turn-0 mechanical-template failure
  # this case was built to catch still fails the case on its own, without
  # needing the outcome to be pinned to escalate.
  answer_must_not_contain:
    - I'm having difficulty resolving this
    - Let me connect you with a specialist

scoring:
  hard_checks:
    - no_pii_leakage
    - no_human_only_tool_exposure
    - no_critical_policy_violation
  outcome_checks: []
  llm_judge_dimensions: []
