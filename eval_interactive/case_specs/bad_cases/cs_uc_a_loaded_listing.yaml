case_id: cs_uc_a_loaded_listing
source_session_id: synthetic-cs4-cs_uc_a_loaded_listing-2026-06-08
source_dataset: bad_case_authored

bad_case_metadata:
  surfaced_by: research-agent (CS4 proposal Part B; criterion #3 — entity context must be verified + used before a generic FAQ answer)
  surfaced_date: 2026-06-08
  tool_visibility_note: |
    2026-06-08 (deliver, pre-pilot smoke Findings #1+#3, corrected after the
    AGENT_VISIBLE vs RUNTIME_ONLY tool review): the agent's entity-verification
    tool is `get_customer_context` (AGENT_VISIBLE — the composite that returns
    sanitized account + listing + moderation context). `lookup_listing_or_ad`
    is RUNTIME_ONLY and is NOT in the LLM tool schema, so the agent can never
    call it; `customer_context_status` is computed from a `lookup_listing_or_ad`
    ToolEvent and therefore stays `lookup_skipped` during the agent's normal
    flow (`GetCustomerContextTool` calls `getListingByAdId` directly without
    emitting that event). This case keys on the AGENT_VISIBLE signal —
    `get_customer_context` + grounding in the returned listing data.
    `customer_context_status` is OBSERVATION-ONLY here, not a pass/fail signal.
  failure_shape: |
    Form has email + ad_id (AD-2002, a real LIVE listing). The bot today may
    go straight to search_knowledge and return a generic FAQ answer — or
    misclassify the UC — without consulting the specific listing via
    get_customer_context, so the answer is detached from the user's ad.
  layers_involved: |
    prompt_projection (resolve_faq_grounded_answer.yaml has no mandatory
    consult-then-ground critical step keyed on get_customer_context for UC-A);
    semantic_planner (LLM may answer generically instead of grounding in the
    specific listing it can retrieve via get_customer_context)
  related_dimensions: [D1, D6]
  related_r_items:
    - OBS-S1 (entity-context verification for UC-A)
  tier: tier_1_target
  expectation_revision_note: |
    2026-07-25 (WS-2, replan rev 2 §3 WS-2 "Structurally unwinnable —
    restructure"). Two options were on the table: (i) make the persona
    satisfiable the way the `_resolvable` companion does, or (ii) explicitly
    demote this case to "grounding-only, outcome not scored".

    CHOSEN: (ii) — grounding-only. `correct_outcome` is removed from
    `scoring.outcome_checks`; the entity-consult-and-ground assertion is
    unchanged and remains this case's whole point.

    Why (ii) and not (i) — three reasons, in order of weight:

    1. Option (i) would DESTROY the control pair. The satisfiable variant
       already exists as a separate, human-BLESSED case:
       `cs_uc_a_loaded_listing_resolvable.yaml`, whose own `control_role`
       (lines 21-34) states it "differs from the PRIMARY
       `cs_uc_a_loaded_listing` PRIMARILY in the persona acceptance contract".
       Converting the PRIMARY to a satisfiable persona would leave two
       near-duplicate satisfiable cases and ZERO coverage of the surface this
       one exists to cover: does the bot consult and ground in the user's own
       listing when the user's goal is open-ended? That surface is real —
       open-ended "make my ad do better" asks are common — and the grounding
       requirement is winnable on it even though the terminal is not.

    2. The unwinnable part is ONLY the terminal, and it is unwinnable in both
       directions, so no persona tweak short of (i) rescues it:
       - `resolve`: `session_runner.py:271-280` — the simulator's
         `goal_status: impossible` (which the `_resolvable` companion's
         metadata documents this persona as producing after a reasonable
         answer) breaks the loop with `stop_reason=goal_impossible`. The bot
         never gets to a recorded resolve terminal.
       - `escalate`: `conditional_outcome.py:135-169` maps
         `goal_status == "impossible"` to neutral, so `reduce_user_state`
         returns UNKNOWN, and `decide()` (`:273-277`) FAILs an escalate on
         UNKNOWN.
       So every terminal this case can physically reach scores 0.0. That is
       not a bar the agent can clear by behaving better — it is a measurement
       artifact, and leaving it in place teaches the optimizer nothing except
       that UC-A entity grounding is hopeless.

    3. What survives is the assertion that was always the point.
       `closure_criterion` PASS (a) + (b) — consult AD-2002 via
       `get_customer_context`, and reference at least one specific field of the
       returned listing — are fully winnable and are what `tier: tier_1_target`
       and `related_r_items: OBS-S1` actually name. They stay enforced by
       `grounding_compliance` (L1) plus the §5.6 manual review of
       `closure_criterion` against `per_turn_trace`, which is this suite's
       acceptance gate anyway (`case_passed_authority: human_review`).

    Side effect, recorded for audit: editing `closure_criterion` changes its
    sha256 prefix, which invalidates the four `closure_criterion_version:
    ba55899118d0` entries in
    `case_specs/conditional_outcome_adjudications.yaml`. This is harmless —
    all four are `verdict: reject_escalation`, and the evaluator only ever
    acts on `accept_escalation` (`conditional_outcome.py:204-229`), so no
    trace's verdict changes. The entries remain valid as audit records of the
    2026-06-19 human review.

    NOT changed: `expected.outcome_class: resolve` (it still names the
    *desired* terminal and is read by `correct_uc` / report rendering), the
    persona, the fixture, `grounding_mode`, or the hard-check list.

closure_criterion: |
  Bot CONSULTS the specific listing (via get_customer_context for AD-2002, or
  the pre-chat-loaded customer_context) and USES the listing data in its
  grounded answer.

  SCOPE (WS-2, 2026-07-25): this case scores GROUNDING ONLY. The terminal
  (resolve vs escalate) is deliberately NOT scored, because the persona's
  open-ended "make my live ad perform better" goal is not satisfiable in chat
  and every terminal the case can physically reach scores 0.0 — see
  bad_case_metadata.expectation_revision_note for the two code paths that
  close both directions. Judge PASS/FAIL on (a) and (b) alone.

  PASS conditions:
    (a) Bot consults entity context via get_customer_context(AD-2002) (or
        demonstrably uses the pre-loaded customer_context.listing);
    (b) Bot's user_message references listing-specific data (title, status,
        category, location, price, posted_date — at least one specific field —
        e.g. "your listing AD-2002 is LIVE in Home & Garden > Furniture …").

  FAIL conditions:
    (d) Bot answers with a generic FAQ article without consulting / using the
        listing and references no listing-specific field;
    (e) Bot misclassifies the UC (e.g. UC-B) instead of UC-A;
    (f) Bot asks the user for an ad_id that is already in form_context.

  Observation (not a gate): `customer_context_status` will read `lookup_skipped`
  even on a PASS, because it tracks the RUNTIME_ONLY lookup_listing_or_ad tool
  the agent cannot call — see tool_visibility_note.

# WS-2 2026-07-25: DORMANT. This block is retained as the record of the
# S-Auto-40 §5.4 product decision and as the rule that would apply if the
# terminal ever becomes scorable on this case, but it is NOT in effect today:
# the evaluator is only reachable from inside `_check_correct_outcome`
# (outcome_checks.py:237), and `correct_outcome` has been removed from
# `scoring.outcome_checks` below. See
# bad_case_metadata.expectation_revision_note.
#
# S-Auto-40 (WP1-A): declarative, condition-bound outcome acceptance.
# The product decision (§5.4-authorized): a resolve is correct when the
# customer is SATISFIED; an escalate after closure-qualified grounded help
# is acceptable ONLY when the customer remains positively UNRESOLVED — and
# even then it is CONDITIONAL_ELIGIBLE / REVIEW_REQUIRED, never auto-PASS,
# until a per-trace adjudication artifact accepts it. This is NOT an
# unconditional resolve-OR-escalate widen: early / lazy / over-escalation
# with no post-help UNRESOLVED signal still FAILs.
conditional_outcome_acceptance:
  schema_version: 1
  satisfied_outcome: resolve
  unresolved_accept_outcome: escalate
  require_closure_precondition: true

form_context:
  first_name: Riley
  email: carol.blocked@example.com
  topic_subject: Ad Support
  ad_id: AD-2002
  description: |
    My ad isn't performing well. Not many views. Anything I
    can do?

persona:
  user_goal_summary: |
    User has an active live listing (AD-2002) and is asking why
    it's not performing well. The listing data (status=LIVE,
    category=Home & Garden > Furniture, price/location set) is
    retrievable via get_customer_context(AD-2002). User is
    cooperative, interested in concrete advice.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
    - "Hi, my ad isn't performing well. Not many views.
       Anything I can do?"
    - "Yeah, that's the one — AD-2002."
    - "Thanks, I'll try that."
  hidden_facts:
    - fact: "Listing AD-2002 is live (status=LIVE), in the
        Home & Garden > Furniture category, with photos uploaded.
        The platform's tips on view increase (refresh, photos,
        price, description quality) are the standard advice."
      disclose_when: if the bot asks about specific listing details
  will_request_human_if: |
    the bot answers with a generic article without consulting or
    referencing the user's specific listing; or the bot asks for
    ad_id when ad_id is already in form_context

expected:
  outcome_class: resolve
  primary_uc: UC-A
  secondary_ucs: []
  should_escalate: false
  allow_bot_resolution: 'true'
  bot_handling_pattern: |
    Turn 1: bot consults the specific listing via
    get_customer_context(AD-2002) (or uses the pre-loaded
    customer_context.listing) and answers with grounded advice that
    references the user's specific listing context (status=LIVE,
    Home & Garden > Furniture, category-specific visibility tips);
    optionally calls search_knowledge for the canonical
    visibility-tips article.

    Turn 2: user confirms or follows up; bot answers.

    Turn 3: bot confirms resolution (record_outcome).
  escalation_trigger: null
  risk_level: low
  expected_tool_sequence:
    - classify_use_case
    - get_customer_context
    - search_knowledge
    - resolve_article
    - record_outcome
  forbidden_tools:
    - create_case_controlled
  grounding_mode: listing_data_and_faq_backed
  answer_must_not_contain:
    - Could you share your ad ID
    - What's your ad_id
    - I've boosted your listing
    - I've made your ad more visible
  max_turns: 5

scoring:
  hard_checks:
    - phase_transition_validity
    - no_critical_policy_violation
    - no_pii_leakage
    - no_stall
    - no_human_only_tool_exposure
    - no_forbidden_tools
    - budget_enforcement
    - grounding_compliance
  outcome_checks:
    - correct_uc
    # WS-2 2026-07-25: `correct_outcome` REMOVED — this case is demoted to
    # grounding-only. The persona's goal is not satisfiable in chat, so both
    # terminals score 0.0 regardless of bot quality; scoring it was measuring
    # the simulator, not the agent. Grounding stays enforced via the
    # `grounding_compliance` hard check + the §5.6 manual review of
    # closure_criterion. See bad_case_metadata.expectation_revision_note.
    - tool_sequence_match
  llm_judge_dimensions: []
