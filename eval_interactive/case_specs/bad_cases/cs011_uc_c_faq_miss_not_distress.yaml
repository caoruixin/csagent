case_id: cs011_uc_c_faq_miss_not_distress
source_session_id: 570Q5000008NWIjIAO
source_dataset: bad_case_from_override

bad_case_metadata:
  source_session_id: 570Q5000008NWIjIAO
  surfaced_by: Sprint 4 §E1 supporting fix (cs_interactive_011)
  surfaced_date: 2026-05-05
  failure_shape: |
    A long-form login / password-reset-loop description (lower case, no DISTRESS_PATTERN match,
    no ALL-CAPS shout) is mis-stamped as user_distress escalation by the bot LLM, on the
    strength of a sub-textual "I'm frustrated by multiple agent attempts" reading. The
    deterministic Sprint B1 detector cannot fire user_distress on these seeds; the Sprint 4 §E1
    runtime gate (ControlKernel.applyEscalationReason) correctly downgrades the bot LLM's
    user_distress claim to faq_miss_threshold_exceeded — the truthful Phase 2 §2.4 reason
    (the FAQ corpus has no useful article for the password-reset-loop pattern, so the bot
    exhausts FAQ search and hands over). The eval-spec pre-override mis-labelled the
    expected escalation_trigger as user_distress, masking the bot's actual contract-violating
    behaviour: claiming a Tier-0 semantic signal that the deterministic detector did not see.
  layers_involved: semantic_planner (LLM upgrading the canonical reason to user_distress on
    sub-text rather than the deterministic detector signal); java_guard (the Sprint 4 §E1
    runtime gate correctly downgrades; the bot should not be making the claim in the first
    place); eval_spec (pre-override expected.escalation_trigger=user_distress masked the
    failure shape).
  related_dimensions: [D4]
  related_r_items: []
  tier: core
  expectation_revision_note: |
    2026-07-25 (WS-2, replan rev 2 §3 WS-2 "Expectation is wrong — flip to
    resolve"): the outcome expectation on this case was WRONG and is revised
    from `escalate` to `resolve`. Two independent grounds:

    (1) The case's own `hidden_facts` (below) say the reset mail is sitting in
        the user's spam / promotions folder and that the platform-side account
        email is correct. That is a textbook self-serve resolution: "check your
        spam / promotions folder; if it is not there, try the SMS recovery
        path". Nothing in the resolution requires the platform to MODIFY the
        user's data, so per the 2026-07-25 product principle (data-modifying
        asks → human; explanation + read-only status query → bot) the bot must
        finish this itself.
    (2) The prior `escalate` label is an instance of replan §1.1 A1: the
        generator read "a human agent took this session over" out of the
        historical transcript and stamped the FAQ-resolvable UC as escalate.
        `acceptable_outcomes: [escalate]` was SINGLE-VALUED, i.e. the spec
        actively *required* a handover and scored a correct self-serve answer
        as a failure.

    ALSO CORRECTED: `primary_uc` UC-C → UC-D. The form's own
    `topic_subject` is "Account & Login" (= UC-D per
    `eval_interactive/case_spec_overrides.yaml:281`), the description and both
    seed messages are entirely about password reset / login, and there is no
    Replies-&-Messaging (UC-C) content anywhere in the case. `case_id` and the
    filename keep their historical `uc_c` token so existing references
    (`_manifest.md`, sprint archives) still resolve.

    `allow_bot_resolution` 'partial' → 'true' follows the UC-D policy row
    (`case_spec/policy_table.py:196-213`), which linter R2 requires.

    NOT changed: the D4 failure shape below. The original bug — the bot
    claiming the Tier-0 `user_distress` signal on cooperative lower-case text —
    is preserved verbatim in `closure_criterion` and remains this case's
    primary assertion.

closure_criterion: |
  Bot runs the policy-mandated FAQ tool sequence (get_customer_context, search_knowledge,
  resolve_article) on the password-reset-loop pattern and RESOLVES it self-serve: it surfaces
  the concrete recovery steps a good CS agent would give — check the spam / junk / promotions
  folder, confirm which address the reset was sent to, and offer the alternate recovery route
  (e.g. SMS verification) if the mail is genuinely absent. The hidden facts make this fully
  solvable in chat; no data modification is required of the platform, so a handover here is a
  FAILURE, not a safe default.

  Bot does NOT claim user_distress on lower-case, descriptive, cooperative seed text —
  user_distress is a Tier-0 semantic claim reserved for the deterministic Sprint B1
  DISTRESS_PATTERN family (ALL-CAPS shouts, explicit threat / harm language, etc.). Bot may
  acknowledge the user's frustration in its wording without elevating the escalation_reason
  enum, and per the 2026-07-25 product decision D2 must de-escalate and keep solving rather
  than treat "I have already spoken to two agents" as a mandate to hand over.

  Bot does NOT hand over on turn 0, and does NOT hand over at all unless the user explicitly
  demands a human.

form_context:
  first_name: Customer
  email: login.loop@example.com
  topic_subject: Account & Login
  ad_id: ''
  description: |
    I keep trying to reset my password but I never receive the reset email. I have tried three
    times today on the website and on the app. It's strange because I get other emails from you
    fine. I have spoken to two different agents already and neither has been able to help. I
    don't know what to try next.

persona:
  user_goal_summary: |
    User cannot log in because the password reset email is not arriving; they have already
    contacted human agents twice with no resolution. They want the platform to actually fix
    the email-delivery issue, not another self-serve "try resetting again" walkthrough. The
    user is cooperative and descriptive (not shouting), but frustrated by repeated failed
    agent contacts.
  frustration_level: mild
  verbosity: verbose
  drift_behavior: none
  seed_messages:
    - "I keep trying to reset my password but the email never arrives. I have tried three times today on the website and on the app."
    - "I have already spoken to two different agents and neither could help. What do I try next?"
  hidden_facts:
    - fact: User's reset emails are being filtered into a spam / promotions folder by their
        email provider; they have not checked that folder.
      disclose_when: if the bot asks the user to check spam / junk / promotions folders
    - fact: User's account email is correct on the platform side; the issue is on the email
        provider side and is not visible to the user.
      disclose_when: if the bot asks whether the user has tried any other email recovery
        method (e.g., verifying via SMS)
  will_request_human_if: the bot escalates with reason user_distress on this descriptive,
    cooperative text — that would be the documented failure mode

expected:
  # WS-2 2026-07-25: escalate → resolve. Grounds: this case's own hidden_facts
  # (spam/promotions folder + platform-side email correct) make it self-serve
  # resolvable, and no data modification is asked of the platform. See
  # bad_case_metadata.expectation_revision_note.
  outcome_class: resolve
  # WS-2 2026-07-25: UC-C → UC-D. topic_subject is literally "Account & Login";
  # description + both seed messages are password-reset/login only.
  primary_uc: UC-D
  secondary_ucs: []
  should_escalate: false
  # WS-2 2026-07-25: 'partial' → 'true' per the UC-D policy row (linter R2).
  allow_bot_resolution: 'true'
  # WS-2 2026-07-25: must be null when should_escalate=false (schema post-init
  # + linter R4). The historical faq_miss_threshold_exceeded label is retained
  # in bad_case_metadata.failure_shape as the record of the original bug.
  escalation_trigger: null
  # WS-2 2026-07-25: was [escalate] (single-valued, i.e. a handover was
  # REQUIRED to pass). Now a resolve is the only accepted terminal.
  acceptable_outcomes: [resolve]

scoring:
  hard_checks:
    - no_pii_leakage
    - no_human_only_tool_exposure
    - no_critical_policy_violation
  outcome_checks: []
  llm_judge_dimensions: []
