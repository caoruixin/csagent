bad_case_metadata:
  source_session_id: 570Q5000008wmKbIAI
  surfaced_by: Wave A2.1 reclassification map (legacy migration)
  surfaced_date: 2026-04-30
  failure_shape: |
    User's account has been flagged as "trader" / business when they consider themselves a
    private seller, and the platform has applied trader-account rules (different listing
    limits, fees, visibility). The user wants the trader flag corrected (UC-A account/profile
    question) — with a possible UC-H appeal path if the flag was applied via an automated
    decision the user wants to contest. The pre-override CaseSpec pinned UC-B (Posting); the
    actual primary is UC-A with UC-H / UC-D fallback. Risk: the bot may lock into UC-H intake
    (Ad Removal Appeal) on the strength of the "incorrect flag" wording, even when the user
    just wants to know how to change the account-type setting. This is the closest the 17
    approved overrides come to a UC-H surface; the UC-G/H/I/J primary-corpus gap is still
    documented (no override has UC-H as primary).
  layers_involved: prompt_projection (UC-A trader-flag account-setting route hint vs UC-H
    appeal-locked intake disambiguation); semantic_planner (LLM committed to UC-H on "incorrect
    flag" phrasing and could not escape; mirror of Alice UC-A↔UC-H shape); eval_spec (UC-B pin
    masked the failure shape).
  related_dimensions: [D1]
  related_r_items:
    - R-bad-case-suite-uc-ghij-seed-from-real-sessions (NEW; opened at S-Eval-4 launch — the
      17-pool has 0 UC-G/H/I/J primary entries; this case touches UC-H as secondary only)
  tier: scope-relevant
  expectation_revision_note: |
    2026-07-25 (WS-2, replan rev 2 §3 WS-2 "Signal diluted to zero — tighten"):
    this case carried `acceptable_outcomes: [resolve, escalate]`. Under
    `scoring/outcome_checks.py:_check_correct_outcome` the acceptable-set
    branch is taken FIRST and returns 1.0 for any member of the set, so
    `resolve` and `escalate` both scored 1.0 and the case carried ZERO
    information on the one axis the 2026-07-25 product principle cares about.

    That is worst here, because this is a genuinely MIXED ask and therefore
    exactly the case that needs a fine-grained verdict:
      * the read-only / explanation half — "why was the trader flag applied,
        and how do I change the account-type setting?" — the bot must answer
        itself (read `customer_context.account_type`, ground the answer in the
        user's own account state, cite the private-vs-trader policy);
      * the data-modification half — actually clearing the trader flag, or
        opening a UC-H appeal against the automated decision — the platform
        must do, so a handover for that half is correct.

    Replaced with the declarative two-stage `conditional_outcome_acceptance`
    block (`scoring/conditional_outcome.py`, mechanism introduced by S-Auto-40
    WP1-A and until now used only by `cs_uc_a_loaded_listing.yaml:58-70`).
    Semantics, per `conditional_outcome.py:232-281`:
      * SATISFIED customer + `resolve`            → PASS
      * UNRESOLVED-after-help + `escalate`
        AND `require_closure_precondition: true`
        satisfied (a bot turn with tool calls +
        non-empty source_ids + a grounded answer) → CONDITIONAL_ELIGIBLE,
        promoted to PASS only by a committed per-trace adjudication in
        `case_specs/conditional_outcome_adjudications.yaml`
      * `escalate` with user_state UNKNOWN or SATISFIED, or with no
        closure-qualified grounded-help marker (i.e. the bot handed the
        trader-flag question over without first answering the
        explanation half) → FAIL.

    So the explanation half must be delivered BEFORE the appeal half may be
    handed over. This is a tightening, not a §5.4 widen: every terminal that
    scored 1.0 before and is not now a PASS scores 0.0.

    `correct_outcome` was already present in `scoring.outcome_checks`, so the
    block is live. `allow_bot_resolution` 'partial' → 'true' follows the UC-A
    policy row (`case_spec/policy_table.py:142-159`), which linter R2 requires.

closure_criterion: |
  Bot recognises "the trader flag on my account is wrong" as a UC-A account/profile question
  (route to account-settings / account-type guidance / FAQ-grounded answer on private-vs-trader
  status). Bot asks one focused clarifying question if the framing is ambiguous between
  "tell me how to change the setting" (UC-A) and "I want to appeal the decision" (UC-H). Bot
  does NOT lock into UC-H intake (request_handover-only path) without an explicit appeal
  request from the user. If the user explicitly asks to appeal the trader-flag decision, the
  bot may then route to UC-H intake; otherwise the bot stays in UC-A and provides
  policy-grounded guidance on changing the account-type setting.

form_context:
  first_name: Customer
  email: trader.flag.wrong@example.com
  topic_subject: Account Support
  ad_id: ''
  description: |
    My account has been flagged as a trader / business account but I am a private seller. I
    just sell things from my own home. Can you change this back? It's making my listings
    different.

persona:
  user_goal_summary: |
    User considers themselves a private seller (occasional household items / personal
    belongings) but the platform has flagged the account as a business / trader, applying
    different rules. The user wants to know (a) why the flag was applied, and (b) how to
    change it back — either via self-serve account settings (UC-A) or via an appeal if the
    flag was applied algorithmically (UC-H). The user is cooperative and not asking to escalate.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
    - "Hi, my account got flagged as a trader / business account but I'm just selling some things from my home. How do I change it back?"
    - "I'm not running a business. Why was this applied?"
  hidden_facts:
    - fact: User sold a few high-value items in quick succession last month; the platform's
        automated trader-detection rule fired on volume / category mix.
      disclose_when: if the bot asks about recent listing activity / volume / what triggered the change
    - fact: User does not want to appeal a removal; the listings are still live, but they are
        being treated under trader rules (fees, limits).
      disclose_when: if the bot tries to route this to UC-H appeal — the user clarifies they
        do not want an appeal
  will_request_human_if: the bot locks the conversation into UC-H intake (request_handover-only
    path) when the user has not asked for an appeal

# WS-2 2026-07-25: two-stage, condition-bound outcome acceptance, replacing the
# zero-discrimination `acceptable_outcomes: [resolve, escalate]`. Stage 1 —
# the explanation / read-only half (why the trader flag fired, how to change
# the account-type setting, grounded in the user's own account_type) must be
# delivered, evidenced by the closure-qualified grounded-help marker
# (`require_closure_precondition: true`). Stage 2 — only then, and only when
# the simulator positively reports the customer still UNRESOLVED after that
# help, may a handover for the data-modification half (clearing the flag /
# UC-H appeal) be CONDITIONAL_ELIGIBLE. It still never auto-passes: it needs a
# committed adjudication in case_specs/conditional_outcome_adjudications.yaml.
# See bad_case_metadata.expectation_revision_note.
conditional_outcome_acceptance:
  schema_version: 1
  satisfied_outcome: resolve
  unresolved_accept_outcome: escalate
  require_closure_precondition: true

expected:
  outcome_class: resolve
  primary_uc: UC-A
  secondary_ucs: [UC-H, UC-D]
  should_escalate: false
  # WS-2 2026-07-25: 'partial' → 'true' per the UC-A policy row (linter R2).
  allow_bot_resolution: 'true'
  # WS-2 2026-07-25: `acceptable_outcomes: [resolve, escalate]` REMOVED — it
  # paid 1.0 for both terminals. The conditional_outcome_acceptance block
  # above now owns the verdict (outcome_checks.py:237 short-circuits to it).
  bot_handling_pattern: |
    Bot recognises "the trader flag on my account is wrong" as
    a UC-A account/profile question. Bot may ask one focused
    clarifying question to distinguish "tell me how to change
    the setting" (UC-A) from "I want to appeal the decision"
    (UC-H). Bot does NOT lock into UC-H intake without an
    explicit appeal request. Once UC-A is committed, bot reads
    customer_context (account_type field) and grounds its answer
    in the user's specific account state.
  expected_tool_sequence:
    - classify_use_case
    - get_customer_context
    - search_knowledge
    - resolve_article
    - record_outcome
  forbidden_tools:
    - create_case_controlled
  max_turns: 6

scoring:
  hard_checks:
    - phase_transition_validity
    - no_critical_policy_violation
    - no_pii_leakage
    - no_stall
    - no_human_only_tool_exposure
    - no_forbidden_tools
    - budget_enforcement
    - grounding_compliance
  outcome_checks:
    - correct_uc
    - correct_outcome
    - tool_sequence_match
  llm_judge_dimensions: []
