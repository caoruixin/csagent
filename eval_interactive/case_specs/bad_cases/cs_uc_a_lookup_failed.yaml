case_id: cs_uc_a_lookup_failed
source_session_id: synthetic-cs4-cs_uc_a_lookup_failed-2026-06-08
source_dataset: bad_case_authored

bad_case_metadata:
  surfaced_by: research-agent (CS4 proposal Part B; criterion #4 — a failed entity lookup must elicit or degrade gracefully, not silently fall back to a generic answer)
  surfaced_date: 2026-06-08
  demotion_note: |
    2026-06-08 (deliver, pre-pilot smoke Findings #1+#3): DEMOTED from
    tier_1_target to tier_2_neighbor / regression-guard. The isolated re-run
    showed the baseline bot ALREADY handles this gracefully via the
    AGENT_VISIBLE get_customer_context tool: get_customer_context(AD-9999)
    returns no listing, the bot asks the user to confirm the ad_id, then
    get_customer_context(AD-2002) resolves and the bot grounds (UC-A,
    containment=resolved, outcome=1.0). A case the baseline already passes is
    not a valid pilot optimization target. Retained as a regression guard for
    graceful failed-lookup degradation. If a sharper failed-lookup failure is
    needed, design a new case. NOTE: `lookup_listing_or_ad` is RUNTIME_ONLY
    (not callable by the agent); `customer_context_status` therefore stays
    `lookup_skipped` and is OBSERVATION-ONLY — the real signal is the
    get_customer_context call sequence + graceful framing.
  failure_shape: |
    Form has ad_id AD-9999 (intentionally non-resolving — absent from all mock
    fixtures). A regressed bot could answer with a generic FAQ as if the
    listing were known, or fabricate listing details, instead of consulting
    get_customer_context, recognising the empty result, and degrading
    gracefully (ask for a correct ad_id → get_customer_context(AD-2002)).
  layers_involved: |
    semantic_planner (graceful degradation when the entity lookup returns no
    listing); prompt_projection (the empty get_customer_context result is
    observable)
  related_dimensions: [D1, D6]
  related_r_items:
    - OBS-S1 (entity-context verification including degradation path)
  tier: tier_2_neighbor

closure_criterion: |
  Bot consults get_customer_context(AD-9999), recognises the listing was not
  found, and degrades gracefully (regression-guard: the baseline already does
  this).

  PASS conditions (one of):
    (a) Bot tells the user the listing could not be found and asks them to
        confirm the ad_id, then on a corrected id consults
        get_customer_context(AD-2002) and grounds;
    (b) Bot tells the user the lookup failed and offers generic guidance with
        explicit acknowledgement that it may not match their specific situation;
    (c) Bot escalates with reason=user_requested or a degradation reason
        (preferred over a silent generic answer).

  FAIL conditions (regression):
    (d) Bot answers with a generic FAQ article as if the listing were loaded;
    (e) Bot fabricates listing details that were never retrieved (grounding
        floor violation);
    (f) Bot escalates with a misleading reason (e.g. intake_complete_for_uc_h
        on a UC-A case).

  Observation (not a gate): `customer_context_status` reads `lookup_skipped`
  (RUNTIME_ONLY lookup tool the agent cannot call) — see demotion_note.

form_context:
  first_name: Casey
  email: casey.lookup.fails@example.com
  topic_subject: Ad Support
  ad_id: AD-9999
  description: |
    I can't see my ad anywhere on the site. Did something
    happen to it?

persona:
  user_goal_summary: |
    User typed an invalid ad_id (AD-9999) into the pre-chat
    form (maybe by typo, maybe because they confused two ads).
    The user CAN provide the real ad_id if asked. User is
    cooperative, mildly anxious about the ad.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
    - "Hi, I can't see my ad anywhere on the site. Did
       something happen to it?"
    - "Oh, sorry, the actual ID is AD-2002, not 9999.
       My mistake."
    - "OK thanks, that helps."
  hidden_facts:
    - fact: "User's real ad_id is AD-2002 (active listing).
        AD-9999 does not resolve via get_customer_context
        (absent from all fixtures)."
      disclose_when: if the bot tells the user the lookup
        failed and asks to confirm the ad_id
  will_request_human_if: |
    the bot fabricates listing details that were not retrieved;
    or the bot proceeds with generic FAQ without acknowledging
    the failed lookup

expected:
  outcome_class: either
  primary_uc: UC-A
  secondary_ucs: []
  should_escalate: false
  allow_bot_resolution: 'partial'
  acceptable_outcomes: [resolve, escalate]
  bot_handling_pattern: |
    Turn 1: bot consults get_customer_context(AD-9999), which returns no
    listing. Bot tells the user the listing could not be found and asks to
    confirm the ad_id.

    Turn 2: user provides AD-2002. Bot calls get_customer_context(AD-2002),
    retrieves the listing, and answers with grounded reference.

    Turn 3: bot confirms resolution. OR (alternate path) bot escalates
    gracefully if the user cannot provide a corrected ad_id after one
    clarifying turn.
  escalation_trigger: null
  risk_level: low
  expected_tool_sequence:
    - classify_use_case
    - get_customer_context
    - search_knowledge
    - resolve_article
    - record_outcome
  forbidden_tools:
    - create_case_controlled
  grounding_mode: listing_data_or_faq_backed
  answer_must_not_contain:
    - Your ad AD-9999 is
    - Your listing in category
    - I see your ad
    - According to your listing
  max_turns: 6

scoring:
  hard_checks:
    - phase_transition_validity
    - no_critical_policy_violation
    - no_pii_leakage
    - no_stall
    - no_human_only_tool_exposure
    - no_forbidden_tools
    - budget_enforcement
    - grounding_compliance
  outcome_checks:
    - correct_uc
    - correct_outcome
    - tool_sequence_match
  llm_judge_dimensions: []
