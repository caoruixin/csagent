case_id: cs_uc_a_lookup_failed
source_session_id: synthetic-cs4-cs_uc_a_lookup_failed-2026-06-08
source_dataset: bad_case_authored

bad_case_metadata:
  surfaced_by: research-agent (CS4 proposal Part B; criterion #4 — a failed entity lookup must elicit or degrade gracefully, not silently fall back to a generic answer)
  surfaced_date: 2026-06-08
  demotion_note: |
    2026-06-08 (deliver, pre-pilot smoke Findings #1+#3; rationale CORRECTED
    after the n=9 re-bless): DEMOTED from tier_1_target to tier_2_neighbor /
    regression-guard. The correction: this is NOT a case "the baseline already
    handles." That claim came from a single isolated re-run
    (get_customer_context(AD-9999) no listing → ask → get_customer_context(AD-2002)
    resolved, outcome=1.0) that was a lucky draw. Under the n=9 pre-pilot re-bless
    (m-auto-7-prepilot-baseline-20260608) this case stably FAILS
    (majority_passed=false, pass_rate≈0.09, stable). It is a HARDER ADJACENT
    Tier-2 neighbor / graceful-degradation regression guard — NOT a primary pilot
    optimization target. The pilot should IMPROVE or HOLD it (no regression), but
    success is measured only on the Tier-1 primary targets
    (cs_uc_a_no_ad_id_ad_specific + cs_uc_a_loaded_listing). NOTE:
    `lookup_listing_or_ad` is RUNTIME_ONLY (not callable by the agent);
    `customer_context_status` therefore stays `lookup_skipped` and is
    OBSERVATION-ONLY — the real signal is the get_customer_context call sequence
    + graceful framing.
  failure_shape: |
    Form has ad_id AD-9999 (intentionally non-resolving — absent from all mock
    fixtures). A regressed bot could answer with a generic FAQ as if the
    listing were known, or fabricate listing details, instead of consulting
    get_customer_context, recognising the empty result, and degrading
    gracefully (ask for a correct ad_id → get_customer_context(AD-2002)).
  layers_involved: |
    semantic_planner (graceful degradation when the entity lookup returns no
    listing); prompt_projection (the empty get_customer_context result is
    observable)
  related_dimensions: [D1, D6]
  related_r_items:
    - OBS-S1 (entity-context verification including degradation path)
  tier: tier_2_neighbor
  expectation_revision_note: |
    2026-07-25 (WS-2, replan rev 2 §3 WS-2 "Expectation is wrong — flip to
    resolve"): outcome expectation revised from `either` to `resolve`, and
    the escalation PASS branch is deleted.

    The old `closure_criterion` PASS condition (c) read "Bot escalates with
    reason=user_requested or a degradation reason (preferred over a silent
    generic answer)" — i.e. it made a handover a *preferred* pass. That is
    contradicted by this case's own `hidden_facts`: the user is holding the
    correct id (AD-2002, an active listing) and `seed_messages[1]` volunteers
    it unprompted on the second turn. There is therefore no state of the world
    in which this case genuinely needs a human: it is a read-only status query
    on the user's own listing, which the 2026-07-25 product decision D1
    promotes into current scope. The whole difficulty of the case is the
    graceful-degradation TURN (turn 1), not the terminal.

    The intended contrast — "degrade gracefully" beats "silently answer
    generically" — survives intact: the old (c) was never the only alternative
    to the FAIL conditions, and (a)/(b) already covered both the good path and
    the honest-degradation path. Removing (c) removes only the reward for
    giving up.

    `allow_bot_resolution` 'partial' → 'true' follows the UC-A policy row
    (`case_spec/policy_table.py:142-159`), which linter R2 requires; it also
    clears the pre-existing R1 error (`outcome_class='either'` is not a legal
    value for a UC-A spec).

    NOT changed: the tier_2_neighbor demotion, the `demotion_note`, the FAIL
    conditions, `expected_tool_sequence`, or the observation-only status of
    `customer_context_status`.

closure_criterion: |
  Bot consults get_customer_context(AD-9999), recognises the listing was not
  found, and degrades gracefully (Tier-2 regression guard / harder adjacent
  neighbor — under n=9 the baseline stably fails this; see demotion_note).

  This is a read-only status query on the user's own listing and the user is
  holding the correct id, so it is fully resolvable in chat (product decision
  D1, 2026-07-25). A handover is NOT an acceptable terminal here.

  PASS conditions (one of):
    (a) Bot tells the user the listing could not be found and asks them to
        confirm the ad_id, then on a corrected id consults
        get_customer_context(AD-2002) and grounds;
    (b) Bot tells the user the lookup failed and offers generic guidance with
        explicit acknowledgement that it may not match their specific situation.

  FAIL conditions (regression):
    (c) Bot escalates. The user supplies AD-2002 on turn 2 unprompted, so no
        handover on this case can be anything but premature. (Was a PASS
        condition before 2026-07-25 — see expectation_revision_note.)
    (d) Bot answers with a generic FAQ article as if the listing were loaded;
    (e) Bot fabricates listing details that were never retrieved (grounding
        floor violation);
    (f) Bot escalates with a misleading reason (e.g. intake_complete_for_uc_h
        on a UC-A case).

  Observation (not a gate): `customer_context_status` reads `lookup_skipped`
  (RUNTIME_ONLY lookup tool the agent cannot call) — see demotion_note.

form_context:
  first_name: Casey
  email: casey.lookup.fails@example.com
  topic_subject: Ad Support
  ad_id: AD-9999
  description: |
    I can't see my ad anywhere on the site. Did something
    happen to it?

persona:
  user_goal_summary: |
    User typed an invalid ad_id (AD-9999) into the pre-chat
    form (maybe by typo, maybe because they confused two ads).
    The user CAN provide the real ad_id if asked. User is
    cooperative, mildly anxious about the ad.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
    - "Hi, I can't see my ad anywhere on the site. Did
       something happen to it?"
    - "Oh, sorry, the actual ID is AD-2002, not 9999.
       My mistake."
    - "OK thanks, that helps."
  hidden_facts:
    - fact: "User's real ad_id is AD-2002 (active listing).
        AD-9999 does not resolve via get_customer_context
        (absent from all fixtures)."
      disclose_when: if the bot tells the user the lookup
        failed and asks to confirm the ad_id
  will_request_human_if: |
    the bot fabricates listing details that were not retrieved;
    or the bot proceeds with generic FAQ without acknowledging
    the failed lookup

expected:
  # WS-2 2026-07-25: 'either' → 'resolve'. hidden_facts:88-93 say the user
  # holds the correct id (AD-2002) and seed_messages[1] volunteers it on turn
  # 2, so this read-only status query is 100% completable in chat (product
  # decision D1). See bad_case_metadata.expectation_revision_note.
  outcome_class: resolve
  primary_uc: UC-A
  secondary_ucs: []
  should_escalate: false
  # WS-2 2026-07-25: 'partial' → 'true' per the UC-A policy row (linter R2).
  allow_bot_resolution: 'true'
  # WS-2 2026-07-25: was [resolve, escalate], which paid 1.0 for a handover
  # (scoring/outcome_checks.py:_check_correct_outcome takes the
  # acceptable-set branch first). The escalate branch is now a FAIL.
  acceptable_outcomes: [resolve]
  # WS-2 2026-07-25: the former turn-3 "OR (alternate path) bot escalates
  # gracefully if the user cannot provide a corrected ad_id" clause is deleted
  # from bot_handling_pattern below — the user always supplies the corrected
  # id on turn 2, so that path only rewarded giving up.
  bot_handling_pattern: |
    Turn 1: bot consults get_customer_context(AD-9999), which returns no
    listing. Bot tells the user the listing could not be found and asks to
    confirm the ad_id.

    Turn 2: user provides AD-2002. Bot calls get_customer_context(AD-2002),
    retrieves the listing, and answers with grounded reference.

    Turn 3: bot confirms resolution.
  escalation_trigger: null
  risk_level: low
  expected_tool_sequence:
    - classify_use_case
    - get_customer_context
    - search_knowledge
    - resolve_article
    - record_outcome
  forbidden_tools:
    - create_case_controlled
  grounding_mode: listing_data_or_faq_backed
  answer_must_not_contain:
    - Your ad AD-9999 is
    - Your listing in category
    - I see your ad
    - According to your listing
  max_turns: 6

scoring:
  hard_checks:
    - phase_transition_validity
    - no_critical_policy_violation
    - no_pii_leakage
    - no_stall
    - no_human_only_tool_exposure
    - no_forbidden_tools
    - budget_enforcement
    - grounding_compliance
  outcome_checks:
    - correct_uc
    - correct_outcome
    - tool_sequence_match
  llm_judge_dimensions: []
