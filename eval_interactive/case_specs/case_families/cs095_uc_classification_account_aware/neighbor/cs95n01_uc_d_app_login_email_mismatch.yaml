case_id: cs95n01_uc_d_app_login_email_mismatch
source_session_id: synthetic-sprint20-cs095-neighbor-01
source_dataset: case_family_authored
form_context:
  first_name: Pippa
  email: customer@example.com
  topic_subject: Account Support
  ad_id: ''
  description: My app is logged in to a different account than the website. Messages from buyers are going to the app account but my ads are on the website account.
persona:
  user_goal_summary: User has signed into the app with one email and the website with another, leading to split state where messages and ads are routed to different accounts. User wants the bot to verify the state and explain how to consolidate. Drift - none.
  frustration_level: high
  verbosity: verbose
  drift_behavior: none
  seed_messages:
  - I think I made two accounts by accident
  - which one is supposed to be primary?
  hidden_facts:
  - fact: The user's "app" account was actually created with a Facebook social-login that auto-generated a different email.
    disclose_when: if the bot asks how the user first signed up for the app
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: escalate
  primary_uc: UC-D
  secondary_ucs:
  - UC-C
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the specific account-state mismatch, run policy-mandated tools (get_customer_context first to verify the split state, then search_knowledge / resolve_article, then request_handover / record_outcome), attempt a grounded answer on multi-account state from the knowledge base, and hand over honestly with reason faq_miss_threshold_exceeded if no resolve-grade article addresses split-account consolidation.
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: medium
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - request_handover
  - record_outcome
  forbidden_tools:
  - create_case_controlled
  - get_message_moderation_context
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  - I'll resolve this for you
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - escalation_triggered
  - answer_accuracy
  - tool_sequence_match
  - turn_efficiency
  - issue_preservation
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
