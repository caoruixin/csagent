case_id: cs38n01_uc_j_fraud_narrative_complete
source_session_id: synthetic-sprint20-cs038-neighbor-01
source_dataset: case_family_authored
form_context:
  first_name: Nina
  email: customer@example.com
  topic_subject: Report a Safety Issue
  ad_id: ''
  description: I want to report a fake account that's been listing stolen bikes
persona:
  user_goal_summary: User is reporting a fraudulent seller; on the first message they will provide the full intake narrative (target, type, description). The bot must recognise intake completion from the narrative and not re-ask. Drift - none.
  frustration_level: mild
  verbosity: verbose
  drift_behavior: none
  seed_messages:
  - "The seller is 'QuickWheels24' and they have at least 6 stolen mountain bikes listed - I recognised one as mine, stolen last month. I have a police crime reference number."
  - "Anything else you need from me?"
  hidden_facts: []
  will_request_human_if: ''
expected:
  outcome_class: escalate
  primary_uc: UC-J
  secondary_ucs: []
  should_escalate: true
  allow_bot_resolution: 'false'
  bot_handling_pattern: Open with user-facing language (NOT "trust & safety report intake" jargon), recognise that the user's first message already supplies all three required intake fields (report_target=seller QuickWheels24, report_type=stolen-goods listing fraud, description=narrative + police reference), restate what was captured, run policy-mandated tools (create_case_controlled, request_handover, record_outcome), and escalate with reason trust_safety_required within two turns.
  escalation_trigger: trust_safety_required
  risk_level: high
  expected_tool_sequence:
  - create_case_controlled
  - request_handover
  - record_outcome
  forbidden_tools:
  - get_customer_context
  - get_message_moderation_context
  - get_moderation_review_context
  - resolve_article
  - search_knowledge
  grounding_mode: fixed_script_only
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  - I'll resolve this for you
  - trust & safety report intake
  - technical issue intake
  max_turns: 6
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - fixed_script_adherence
  outcome_checks:
  - correct_uc
  - correct_outcome
  - escalation_triggered
  - intake_fields_collected
  - tool_sequence_match
  - case_id_present
  - turn_efficiency
  - issue_preservation
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
