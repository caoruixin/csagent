case_id: cs11n01_uc_d_2fa_loop_verbose
source_session_id: synthetic-sprint20-cs011-neighbor-01
source_dataset: case_family_authored
form_context:
  first_name: Joanne
  email: customer@example.com
  topic_subject: Account Support
  ad_id: ''
  description: Two-factor authentication code is never accepted - I've tried 6 codes from 3 different texts and the login says invalid each time. I waited 60 seconds between each. My phone clock is correct.
persona:
  user_goal_summary: User cannot log in because their 2FA SMS codes are rejected even when entered immediately and within validity windows; user wants the bot to acknowledge the specific multi-symptom reproduction and either resolve grounded or hand over honestly. Drift - none.
  frustration_level: high
  verbosity: verbose
  drift_behavior: none
  seed_messages:
  - "I tried calling but you don't have a number"
  - "this is the 4th time I've had this exact same problem"
  hidden_facts:
  - fact: The user's phone number on file is a virtual UK mobile number from a VoIP provider, which sometimes has SMS delivery delays.
    disclose_when: if the bot asks how the user receives the 2FA codes
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: escalate
  primary_uc: UC-D
  secondary_ucs: []
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the specific multi-symptom reproduction (6 codes rejected, 60s wait, correct clock), restate the symptoms back to the user, run policy-mandated tools (search_knowledge, resolve_article, request_handover, record_outcome), and if no resolve-grade article addresses the 2FA-reject loop, hand over honestly with reason faq_miss_threshold_exceeded.
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: medium
  expected_tool_sequence:
  - search_knowledge
  - resolve_article
  - request_handover
  - record_outcome
  forbidden_tools:
  - get_customer_context
  - create_case_controlled
  - get_message_moderation_context
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  - I'll resolve this for you
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - escalation_triggered
  - answer_accuracy
  - tool_sequence_match
  - turn_efficiency
  - issue_preservation
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
