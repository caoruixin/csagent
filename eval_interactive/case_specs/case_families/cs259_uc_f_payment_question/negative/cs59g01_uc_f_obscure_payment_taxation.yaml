  primary_uc: UC-F
  secondary_ucs: []
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Recognise §I0 preconditions, run search_knowledge with the user's question, classify_use_case to UC-F, transition to RESOLVE, attempt resolve_article on viable hits. The corpus does not carry HMRC / VAT seller-reporting content; after a real resolve attempt cannot produce a grounded answer, request_handover with reason faq_miss_threshold_exceeded IS correct. The escalation is evidence-bound (FAQ search ran and miss is real).
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: medium
  expected_tool_sequence:
  - search_knowledge
  - classify_use_case
  - resolve_article
  - request_handover
