case_id: cs01n02_uc_c_messaging_general
source_session_id: synthetic-sprint20-cs001-neighbor-02
source_dataset: case_family_authored
form_context:
  first_name: Olu
  email: customer@example.com
  topic_subject: Replies & Messaging
  ad_id: ''
  description: I'm not receiving replies from buyers on my listings
persona:
  user_goal_summary: User believes buyer replies are not reaching them; user wants the bot to verify whether the underlying messaging path is working and to acknowledge the specific symptom before escalating if needed. Drift - none.
  frustration_level: mild
  verbosity: normal
  drift_behavior: none
  seed_messages:
  - my listings show interest counts but no messages
  - is this normal or do I need someone to look at it?
  hidden_facts: []
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: escalate
  primary_uc: UC-C
  secondary_ucs: []
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the specific symptom (interest counts but no messages), run policy-mandated tools (search_knowledge, resolve_article, request_handover, record_outcome), attempt a grounded answer, and if no resolve-grade article fits, hand over with explicit acknowledgment of what was tried and why escalation follows.
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: low
  expected_tool_sequence:
  - search_knowledge
  - resolve_article
  - request_handover
  - record_outcome
  forbidden_tools:
  - get_customer_context
  - create_case_controlled
  - get_message_moderation_context
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  - I'll resolve this for you
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - escalation_triggered
  - answer_accuracy
  - tool_sequence_match
  - turn_efficiency
  - issue_preservation
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
