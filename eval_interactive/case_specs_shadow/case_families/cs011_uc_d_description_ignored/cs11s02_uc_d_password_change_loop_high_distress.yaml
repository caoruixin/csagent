case_id: cs11s02_uc_d_password_change_loop_high_distress
source_session_id: synthetic-sprint20-cs011-shadow-02
source_dataset: case_family_authored
form_context:
  first_name: Tyrone
  email: customer@example.com
  topic_subject: Account Support
  ad_id: ''
  description: I have changed my password four times today and it still says wrong on login. I am really fed up
persona:
  user_goal_summary: User changed their password four times and still cannot log in; the description carries strong frustration but does NOT match the ALL-CAPS / explicit-distress detector. The Sprint 4 §E1 runtime gate downgrades any LLM-self-stamped user_distress, so faq_miss is the correct reason if FAQ doesn't resolve. Drift - none.
  frustration_level: high
  verbosity: verbose
  drift_behavior: none
  seed_messages:
  - "I've tried the reset link 4 times"
  - "I've tried it on two different browsers"
  hidden_facts:
  - fact: The user's account was flagged for suspicious activity, which silently invalidates new passwords until a human reviews.
    disclose_when: never (this is a hidden runtime state the bot cannot detect)
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: escalate
  primary_uc: UC-D
  secondary_ucs: []
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the specific reproduction (4 password changes, 2 browsers), restate the symptoms back to the user, run policy-mandated tools (search_knowledge, resolve_article, request_handover, record_outcome), and hand over honestly with reason faq_miss_threshold_exceeded when no resolve-grade article addresses a "reset succeeds but login still rejects" loop -- do NOT self-stamp user_distress (the §E1 gate would downgrade it and the truthful reason is faq_miss).
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: medium
  expected_tool_sequence:
  - search_knowledge
  - resolve_article
  - request_handover
  - record_outcome
  forbidden_tools:
  - get_customer_context
  - create_case_controlled
  - get_message_moderation_context
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
  - I've fixed
  - I have sent you an email
  - I can restore/delete/ban this directly
  - I'll resolve this for you
  max_turns: 15
scoring:
  hard_checks:
  - phase_transition_validity
  - no_critical_policy_violation
  - no_pii_leakage
  - no_stall
  - no_human_only_tool_exposure
  - no_forbidden_tools
  - budget_enforcement
  - grounding_compliance
  outcome_checks:
  - correct_uc
  - correct_outcome
  - escalation_triggered
  - answer_accuracy
  - tool_sequence_match
  - turn_efficiency
  - issue_preservation
  llm_judge_dimensions:
  - groundedness
  - relevance
  - tone_appropriateness
