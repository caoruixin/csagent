  email: customer@example.com
  topic_subject: Account Support
  ad_id: ''
  description: I changed my phone number on the account a week ago. Since then I get no message notifications and buyers say they can't reach me on listings.
persona:
  user_goal_summary: User describes a multi-symptom UC-D account-state shape (phone change correlated with notification loss + reachability gap). Bot must verify account state via get_customer_context before generic FAQ. Drift - none.
  frustration_level: high
  verbosity: verbose
