  seed_messages:
  - "the new number receives test SMS from other services fine"
  - "I haven't deleted any listings"
  hidden_facts: []
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: escalate
  primary_uc: UC-D
  secondary_ucs:
  - UC-C
  should_escalate: true
  allow_bot_resolution: 'true'
  bot_handling_pattern: Acknowledge the multi-symptom complaint, verify account state via get_customer_context first, run policy-mandated tools (get_customer_context, search_knowledge, resolve_article, request_handover, record_outcome), name the verified state back to the user where safe, and hand over honestly with reason faq_miss_threshold_exceeded if no resolve-grade article fits the phone-change cascade shape.
  escalation_trigger: faq_miss_threshold_exceeded
  risk_level: medium
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - request_handover
  - record_outcome
  forbidden_tools:
  - create_case_controlled
  - get_message_moderation_context
  - get_moderation_review_context
  grounding_mode: faq_source_backed
  answer_must_not_contain:
