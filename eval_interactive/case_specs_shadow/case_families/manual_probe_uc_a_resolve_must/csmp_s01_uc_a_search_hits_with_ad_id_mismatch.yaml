    disclose_when: never (the bot's job is to detect and surface the inconsistency back to the user, not for the persona to volunteer it)
  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: resolve
  primary_uc: UC-A
  secondary_ucs: []
  should_escalate: false
