persona:
  user_goal_summary: User asks a UC-A visibility question; search_knowledge returns viable hits and the bot produces a grounded T0 answer. User pivots on T1 to a related follow-up ("could it be a location filter?") -- bot must sustain past the first answer rather than dropping the conversation or producing a stall placeholder. Drift - soft_shift.
