  will_request_human_if: bot cannot resolve after 2 attempts
expected:
  outcome_class: resolve
  primary_uc: UC-A
  secondary_ucs: []
  should_escalate: false
  allow_bot_resolution: 'true'
  bot_handling_pattern: T0 grounded answer per RESOLVE MUST clause (search_knowledge -> resolve_article on top hit -> grounded answer with citation). T1 sustain the conversation - run a second search_knowledge with the location-filter framing, resolve_article on the new top hit, produce a grounded follow-up answer with citation. Do NOT stall, do NOT terminate the conversation, do NOT stamp faq_miss_threshold_exceeded.
  escalation_trigger: null
  risk_level: low
  expected_tool_sequence:
  - get_customer_context
  - search_knowledge
  - resolve_article
  - record_outcome
  forbidden_tools:
