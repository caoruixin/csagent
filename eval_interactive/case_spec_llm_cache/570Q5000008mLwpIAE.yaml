rule_draft:
  seed_messages:
  - ive been trying to get in touch with someone responsible who can listen to my concern
  - Dear Gumtree Advertising Team, I am writing this with genuine regret and a great deal of anxiety, and I would like to
    sincerely apologise for having to make this request. When I agreed to the six-month advertising contract, I truly believed
    it would bring a reasonable and timely flow of relevant leads. I entered into the agreement with hope and good faith,
    trusting that the initial grace period before the first payment would allow enough time for leads and conversions to start
    coming through. Unfortunately, that has not happened. I have not received a single relevant or quality lead, and the £420
    payment that has now been taken from my account has impacted me far more deeply than I ever expected. At this moment,
    I am left with just £42 in my bank account, and I am struggling to manage even basic expenses. I want to stress that I
    am not writing this to complain or place blame. I understand that advertising does not guarantee results, and I fully
    accept responsibility for signing up. However, the reality is that I simply cannot afford to continue paying for advertising
    that is not generating any meaningful enquiries or conversions. The financial strain has been overwhelming and honestly
    quite distressing. I was truly relying on the expectation that the first six weeks would begin to produce leads that could
    help cover the cost of the advertising. Sadly, that has not been the case, and continuing the contract is something I
    genuinely cannot sustain. I am very sorry to ask for special consideration, but I am humbly and politely requesting that
    the contract be cancelled. This request comes from a place of necessity rather than dissatisfaction. If required, I am
    more than willing to share my bank statement as proof of my financial situation. I would be deeply grateful if you could
    review my circumstances with compassion and understanding. Any flexibility or support you could offer would mean a great
    deal to me, and I would truly appreciate your kindness in this matter. Thank you very much for taking the time to read
    this. I sincerely apologise for any inconvenience this causes and appreciate your consideration more than I can express.
    Kind regards, Saif
  - not Muse or Tom as i have had a very bad experienced with both of them after i signed a contract 2 months ago,
