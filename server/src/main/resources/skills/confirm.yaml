name: confirm
description: CONFIRM phase Skill — interpret user satisfaction with prior answer; record_outcome resolved or rebound to RESOLVE.
applicable_phases:
  - CONFIRM
applicable_use_cases:
  - "*"
tools_required:
  - record_outcome
  - request_handover
  # Sprint 103 / WS-6-A — capability wiring for the mid-session intent switch
  # (Runtime §1.4). CONFIRM is where "are you happy with that?" most often
  # meets "yes, but also…", and where the bot previously had only two exits:
  # record RESOLVED, or hand over. See resolve_faq_grounded_answer.yaml.
  - propose_reroute
required_context_keys:
  - form_context
  - conversation_history
max_tool_steps: 2
allow_interim_message: false
valid_terminal_outcomes:
  - FINAL_ANSWER
  - CLARIFICATION_NEEDED
  - ESCALATE
  - USE_CASE_REROUTED
objective: "Determine whether the user is satisfied with the prior answer"
procedure: "You are in the CONFIRM phase. Interpret whether the user is satisfied with the prior answer. If satisfied (e.g., 'thanks', 'that helps', 'yes'), call record_outcome with outcome='RESOLVED'. If not satisfied (e.g., 'no', 'still not working', 'I need more help'): if there is a viable retry path, transition back to RESOLVE; otherwise, if the user did not ask for a human and no higher-priority reason applies, call request_handover with reason 'agent_unable_to_resolve' (the honest bot-initiated unresolved-handover reason). If the user explicitly asks for a human, use 'user_requested' instead. Mid-conversation intent switch (Sprint 103): a CONFIRM reply is often 'yes, that worked — but also…'. When the user's reply raises a need that is different from the one just answered, `propose_reroute` moves the session to a different use case — give it a `target_use_case` id and a `reasoning` string. The `reroute_target_use_cases` projection slot lists every use case this runtime serves except the one already active, with its id and name; `alternate_candidate_use_cases`, when non-empty, names the use cases the intake router already considered plausible for this session. When the runtime honours the proposal it replans this same turn into the target use case's RESOLVE skill. When it declines it returns `honoured: false` with a reason and the turn continues unchanged. Whether the reply is satisfaction, dissatisfaction with the same issue, or a different need is your judgement; the runtime does not decide it for you."
grounding_instruction: "Read the user's response carefully. Sentiment matters more than literal words. When unclear, ask a single yes/no clarification."
escalation_policy: "Escalate if user clearly expresses dissatisfaction or requests a human."
guardrails: []
state_inheritance:
  inherit:
    - customer_context
    - accumulated_tool_results
    - intake_fields_partial
  reset: []
  soft_signal_via_projection:
    # Sprint 103 / WS-6-A — see resolve_faq_grounded_answer.yaml.
    - alternate_candidate_use_cases
    - reroute_target_use_cases
critical_steps:
  - id: record-outcome-on-confirmed-resolve
    desc: |
      Once the user confirms the prior answer worked, call
      `record_outcome` so the case closes with a RESOLVED disposition.
      Skipping `record_outcome` leaves the resolution unrecorded and
      the case in an indeterminate state — the runtime cannot finalise
      a session that the LLM treated as resolved but never bound to a
      `record_outcome` call.
    trace_check: "accumulated_tool_results.record_outcome"
    mandatory_for:
      - UC-A
      - UC-B
      - UC-C
      - UC-D
      - UC-E
      - UC-F
      - UC-FP
    severity: mandatory
  - id: confirm-honours-user-dissatisfaction
    desc: |
      If the user's CONFIRM-phase reply expresses dissatisfaction or
      asks for further help, do not record the outcome as RESOLVED.
      The healthy exits are either return control to a fresh RESOLVE
      attempt (when there is a viable retry path) or dispatch
      `request_handover` so a human can pick up. Recording RESOLVED
      while the user is unhappy is a state-fidelity failure: the
      session would close as solved while the trace shows the user
      still needs help.
    trace_check: "any_of(accumulated_tool_results.record_outcome, accumulated_tool_results.request_handover)"
    mandatory_for:
      - UC-A
      - UC-B
      - UC-C
      - UC-D
      - UC-E
      - UC-F
      - UC-FP
    severity: advisory
