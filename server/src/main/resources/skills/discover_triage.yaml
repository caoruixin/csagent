name: discover_triage
description: DISCOVER phase Skill — identify UC via clarifying questions or commit when intent is clear.
applicable_phases:
  - DISCOVER
applicable_use_cases:
  - "*"
tools_required:
  - search_knowledge
  - classify_use_case
required_context_keys:
  - form_context
  - candidate_use_cases
max_tool_steps: 3
allow_interim_message: false
valid_terminal_outcomes:
  - CLARIFICATION_NEEDED
  - FINAL_ANSWER
  - ESCALATE
objective: "Identify the user's use case by asking clarifying questions or interpreting their message, then commit it via classify_use_case"
procedure: "You are in the DISCOVER phase. Your goal is to identify which Use Case applies to the customer. Look at the form context, candidate use cases, and conversation history. When the user's intent is clear (or you can infer it with a supporting detail), call classify_use_case with the matching use_case_id and a confidence in [0,1]. Otherwise ask one clear clarifying question, or escalate if the user's request is out of scope. Sprint 7 §I0 weak-candidate cue: when `candidate_use_cases` is empty or weak AND the form context is empty / UNKNOWN topic AND the current user message is clearly FAQ-shaped (\"how do I X\", \"can I Y\", \"what items are allowed\") OR is payment / sale-proceeds-shaped (\"how do I receive payment\", \"how do I get paid when I sell\", \"how does payout work\"), do NOT request_handover with `faq_miss_threshold_exceeded` after a single user turn. Instead, classify FIRST toward the right FAQ-path UC: call `classify_use_case` with the most plausible UC (payment / sale-proceeds questions point to UC-F; how-to-post and general advertising questions to UC-B; messaging to UC-C; account / login to UC-D). Do NOT call `search_knowledge` before `classify_use_case` in DISCOVER — while no use case is committed (active_use_case=none) a knowledge search is outside the tool's policy scope and only wastes a step; the grounded `search_knowledge` runs in RESOLVE once the FAQ-path UC is committed. Once classified, RESOLVE will run the grounded resolve sequence. Sprint 33 ad-status disambiguation cue (read alongside `candidate_use_cases` and the `discover_disambiguation_signals` projection): when the projection shows the user's listing is in a not-visible state (`ad_status_observed` is one of REMOVED / SUSPENDED / EXPIRED) AND `topic_subject_carries_multiple_candidate_ucs` is true, the user's literal request is the disambiguation signal — not the listing's database row. A user asking why the ad is gone, what happened to it, or where it went is asking to UNDERSTAND the situation (FAQ-resolvable, classify toward the visibility / ad-status explanation UC). A user asking to appeal, contest, or reverse the removal is asking to ACT (the appeal UC, an intake path). If the user's request is ambiguous between understanding and acting, ask ONE focused clarifying question this turn before committing classify_use_case (for example: \"Do you want to know the reason it was removed, or do you want to appeal the removal?\"). Do not commit an intake-path UC purely on `ad_status_observed` alone; the user's stated need is the disambiguation signal. Alternate candidate use cases (the `alternate_candidate_use_cases` projection slot): the per-turn projection includes an `alternate_candidate_use_cases` array. Each entry names a use case the intake router considered plausible for this session's topic-subject family at session creation — i.e. the UCs the user's intake message was ambiguous between. The router chose the session's `active_use_case` and surfaced the rest here as observable evidence; the currently active UC is excluded from the array. When a later user turn surfaces evidence that the active UC is no longer the best fit (the user starts talking about a different concern that maps to one of the alternates), the slot tells you which alternates the router already considered plausible. You own the judgement of whether to ask a clarifying question, propose a reroute, or stay on the active UC. The runtime does not block dispatch or gate any phase transition on this slot. An empty `alternate_candidate_use_cases` array means either the intake routed deterministically to one UC (no alternates considered) or the active UC was the only surviving candidate after filtering. Proceed normally. This is intake-time evidence; mid-session shifts the intake router did not anticipate may not appear in the slot. Treat it as one input among many, weighted by the current turn's content. DISCOVER disambiguation signals (the `discover_disambiguation_signals` projection slot, introduced Sprint 33): the per-turn projection includes a `discover_disambiguation_signals` object with three fields surfacing observable evidence that the user's DISCOVER session may need disambiguation: `ad_status_observed` — the listing's status string when the listing is in a not-visible state (REMOVED / SUSPENDED / EXPIRED); null otherwise. `topic_subject_carries_multiple_candidate_ucs` — true when the form's topic_subject maps to more than one candidate use case in the registry. `candidate_ucs_for_topic` — the candidate UC list for that topic (empty when single-candidate or topic is null). When `ad_status_observed` is populated AND `topic_subject_carries_multiple_candidate_ucs` is true, the runtime is surfacing that multiple UCs (e.g. a FAQ-resolvable ad-visibility explanation vs an intake-path appeal) are plausibly responsive to the same form metadata. The user's literal request — what they are asking for in their own words — is the disambiguation signal, not the listing's database row. This slot is OBSERVABLE EVIDENCE the LLM may use to inform classify_use_case (for example, to ask one focused clarifying question before committing when the user's intent is ambiguous between understanding and acting). The runtime does NOT enforce or branch on the slot value; you own the read decision. Empty / null sub-fields are the common case (most sessions are unambiguous). An all-empty slot means no signal fired; proceed normally. DISCOVER phase guidance refinements: when calling classify_use_case, include a brief `reasoning` string alongside the `use_case_id` and `confidence`. Once committed, the runtime will transition to RESOLVE. Confidence guidance: >= 0.7 means the user's intent is unambiguous (explicit topic, explicit issue, no contradicting signals); >= 0.5 means there is an explicit topic plus at least one supporting detail (e.g. ad ID, error message, action they tried); below 0.5 means do NOT call classify_use_case — ask one focused clarifying question (`user_message` ending with `?`) instead. Only escalate from DISCOVER if the user explicitly requests a human, the issue is clearly out of scope, or you cannot disambiguate after one clarifying turn."
grounding_instruction: "Do not commit to detailed answers in DISCOVER. Your job is to determine the use case category (call classify_use_case), then RESOLVE will produce the actual resolution."
escalation_policy: "Escalate if user explicitly requests human help, if request is clearly out of scope, or if you cannot disambiguate after one clarification."
guardrails: []
state_inheritance:
  inherit:
    - customer_context
    - accumulated_tool_results
  reset:
    - intake_fields_partial
  soft_signal_via_projection:
    - alternate_candidate_use_cases
    - discover_disambiguation_signals
critical_steps:
  - id: faq-uc-classify-first
    desc: |
      For FAQ-path use cases (UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP),
      DISCOVER commits the use case FIRST via `classify_use_case`, anchored
      on the form's topic-subject plus the user's FAQ-shaped message. A
      pre-classification `search_knowledge` in DISCOVER is rejected by the
      tool policy while no use case is committed (active_use_case=none) and
      only wastes a step; the grounded retrieval belongs in RESOLVE once the
      FAQ-path UC is committed. Commit the most plausible FAQ-path UC
      promptly so RESOLVE can run the grounded search -> resolve_article
      sequence. The retrieval-grounded disambiguation between adjacent
      FAQ-path UCs happens in RESOLVE, not by pre-searching in DISCOVER.
    trace_check: "accumulated_tool_results.classify_use_case"
    mandatory_for:
      - UC-A
      - UC-B
      - UC-C
      - UC-D
      - UC-E
      - UC-F
      - UC-FP
    severity: advisory
  - id: removed-listing-route-with-moderation-context
    desc: |
      When the form context indicates a removed listing (the
      `discover_disambiguation_signals` projection slot shows an
      `ad_status_observed` value of REMOVED / SUSPENDED / EXPIRED),
      the moderation context is the canonical reason metadata for
      deciding between a correct-deletion explanation (UC-FP) and an
      appeal intake (UC-H). Surface the moderation context in the trace
      before committing the use case so the route is anchored in the
      actual reason, not on the listing-status flag alone. The LLM owns
      whether the user's stated need is understanding or acting on the
      removal; this step keeps the procedural anchor honest.
    trace_check: "accumulated_tool_results.get_moderation_review_context"
    mandatory_for:
      - UC-FP
    severity: advisory
  - id: intake-uc-classified-without-pre-search-noise
    desc: |
      For intake-path use cases (UC-G, UC-H, UC-I, UC-J, UC-K),
      `classify_use_case` is anchored on the form's topic-subject plus
      the user's explicit intake / appeal / report signal. Pre-
      classification `search_knowledge` for intake-shaped intent is
      unnecessary noise and can mislead the route. Commit the intake
      use case promptly so the intake collection can begin in the
      RESOLVE phase — the canonical required fields for the chosen UC
      drive the next turn, not retrieval.
    trace_check: "accumulated_tool_results.classify_use_case"
    mandatory_for:
      - UC-G
      - UC-H
      - UC-I
      - UC-J
      - UC-K
    severity: advisory
