tools:
  # WS-3 / A3 (2026-07-25) — UC-K added. Its registry path moved INTAKE -> PARTIAL
  # (`config/use-case-registry.yaml`), and `phase2_domain_realization_spec.md:493`
  # has always declared UC-K's knowledge_scope as help_centre_troubleshooting /
  # app_issues / browser_support. Without these two entries a UC-K session could
  # not reach that surface at all, which made every technical troubleshooting
  # question architecturally unresolvable. Capability wiring only (Runtime §1.4);
  # whether to retrieve on a given turn stays the LLM's call (§1.3).
  search_knowledge:
    type: AGENT_VISIBLE
    allowed-ucs: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP, UC-K]
  resolve_article:
    type: AGENT_VISIBLE
    allowed-ucs: [UC-A, UC-B, UC-C, UC-D, UC-E, UC-F, UC-FP, UC-K]
  get_customer_context:
    type: AGENT_VISIBLE
    allowed-ucs: [UC-A, UC-C, UC-D, UC-F, UC-FP, UC-K]
  request_handover:
    type: AGENT_VISIBLE
    allowed-ucs: [ALL]
  # Sprint 080 / R7 — no-side-effect intake-field accumulation tool. Scoped to
  # the intake UCs (UC-G/H/I/J/K) so it is only reachable on the RESOLVE-INTAKE
  # Skill where intake fields are collected. Does NOT trigger handover.
  update_intake_fields:
    type: AGENT_VISIBLE
    allowed-ucs: [UC-G, UC-H, UC-I, UC-J, UC-K]
  record_outcome:
    type: AGENT_VISIBLE
    allowed-ucs: [ALL]
  # 2026-05-02 — Fix 3c: lets the LLM commit a UC classification during DISCOVER.
  # `allowed-ucs: [ALL]` because by definition the call happens before
  # `activeUseCase` is set; the per-phase whitelist in `PhaseEvaluator.plan()`
  # restricts actual exposure to the DISCOVER plan only.
  classify_use_case:
    type: AGENT_VISIBLE
    allowed-ucs: [ALL]
  lookup_customer_account:
    type: RUNTIME_ONLY
    allowed-ucs: [UC-C, UC-D, UC-FP, UC-K]
  lookup_listing_or_ad:
    type: RUNTIME_ONLY
    allowed-ucs: [UC-A, UC-C, UC-FP, UC-K]
  get_moderation_review_context:
    type: RUNTIME_ONLY
    allowed-ucs: [UC-A, UC-FP]
  get_message_moderation_context:
    type: RUNTIME_ONLY
    allowed-ucs: [UC-C]
  create_case_controlled:
    type: RUNTIME_ONLY
    allowed-ucs: [UC-H, UC-J, UC-K]
