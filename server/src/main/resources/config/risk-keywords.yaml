# Sprint 15 §M0 — DriftDetector risk keyword config.
#
# Behaviour-preserving externalization of the previously hardcoded
# DriftDetector.HARD_SHIFT_KEYWORDS list and ESCALATION_PATTERN regex.
#
# Contract (must be preserved exactly):
#   - escalation-pattern is a single (?i)-flagged regex compiled with
#     java.util.regex.Pattern. A match in the raw user message returns
#     DriftType.USER_ESCALATION_REQUEST (escalationRequested=true,
#     newUseCase=null). Escalation precedes any hard-shift match.
#   - hard-shift-groups are evaluated in declaration order. Within a
#     group, keywords are evaluated in declaration order. The match
#     condition is exactly: lowercased(userMessage).contains(keyword)
#     where keyword is already lowercase. The first matching keyword
#     across groups wins.
#   - A hard-shift only fires when the matched group's target-use-case
#     differs from session.activeUseCase (a same-UC match returns
#     DriftType.NONE).
#
# Sprint 15 explicitly does NOT introduce new risk semantics, new risk
# levels, new escalation reasons, or auto-handover for Level 1 / Level 2
# risk signals. Future risk-policy reviews should land here as
# config diff rather than Java source edits.

# WS-3 / D2 (2026-07-25) — frustration posture.
#
# This file is the DETERMINISTIC surface only: an explicit request for a human,
# and hard topic shifts into fraud / safety / GDPR / payment-dispute / appeal
# territory. Those are Runtime-owned boundaries (§1.4).
#
# Customer FRUSTRATION is deliberately NOT represented here and MUST NOT be
# added as keywords. Whether a frustrated customer should be handed over or
# de-escalated and helped is a semantic judgement about what the customer is
# actually asking for — Constitution §1.3 assigns it to the LLM, and §1.5 /
# §1.7 forbid encoding it as a keyword table. The runtime surfaces frustration
# to the LLM as an advisory `user_sentiment_signal` projection slot
# (ContextProjectionBuilder) and the system prompt states the policy; neither
# forces a handover. See phase0_normative_freeze.md §0.6 deviation
# "2026-07-25 — frustration is not an escalation trigger".

version: 1

# The escalation pattern must match a REQUEST for a human, not a MENTION of
# support. Prior to WS-3 / D2 this alternation ended with the bare noun phrases
# `customer service` and `live support`, so ordinary complaint phrasing — "your
# customer service is useless", "this is the worst customer service I've had" —
# matched, and `ControlKernel.processMessage` step 4 called `forceEscalate`
# immediately. That was the one place where "customer indicates frustration =>
# escalate" was actually executable code, and it fired on a complaint ABOUT the
# service rather than a request to reach it. Both phrases now require a
# request verb in front of them; every genuine request form
# ("connect me to customer service", "put me through to live support", "I want
# to speak to customer service") still matches, via this clause or the
# `connect me` / `speak (to|with)` clauses above it.
escalation-pattern: "(?i)(talk to (an?\\s+)?agent|human agent|real person|transfer me|speak (to|with) (a\\s+)?(human|person|agent|someone)|connect me|live agent|(talk|speak|transfer|connect|put me through|get me|escalate)\\b[^.?!]{0,30}\\b(customer service|live support))"

hard-shift-groups:
  - target-use-case: UC-J
    keywords:
      - scam
      - scammed
      - fraud
      - fraudulent
  - target-use-case: UC-G
    keywords:
      - delete my data
      - delete my account
      - gdpr
      - data deletion
      - right to be forgotten
  - target-use-case: UC-I
    keywords:
      - refund
      - money back
      - charge back
      - chargeback
      - dispute payment
  - target-use-case: UC-J
    keywords:
      - unsafe
      - harassment
      - threatening
      - danger
      - abusive
  - target-use-case: UC-H
    keywords:
      - ad removed
      - ad deleted
      - ad taken down
      - why was my ad removed
      - appeal
