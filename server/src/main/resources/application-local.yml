spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:csagent}?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

llm:
  kimi:
    api-key: ${KIMI_API_KEY:}
    base-url: ${KIMI_BASE_URL:}
    model: ${KIMI_MODEL:}
    thinking-enabled: ${KIMI_THINKING_ENABLED:false}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:}
    model: ${DEEPSEEK_MODEL:}
    thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:}
    embedding-dimension: ${DASHSCOPE_EMBEDDING_DIMENSION:768}

mock:
  business-hours: true

# D16.B/C/D: enable AgentRunLoop for ALL phases in local dev.
# Baseline application.yml keeps the list empty for production safety.
agent:
  run-loop:
    enabled-phases: [RESOLVE_FAQ, RESOLVE_INTAKE, DISCOVER, CONFIRM, CLOSE, ESCALATE]
