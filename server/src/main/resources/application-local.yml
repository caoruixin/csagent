spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:csagent}?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

llm:
  kimi:
    api-key: ${KIMI_API_KEY:}
    base-url: ${KIMI_BASE_URL:https://api.moonshot.ai/v1}
    model: ${KIMI_MODEL:kimi-k2.6}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    chat-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimension: ${DASHSCOPE_EMBEDDING_DIMENSION:768}

mock:
  business-hours: true
