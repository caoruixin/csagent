budgets:
  max-clarification-rounds: 2
  max-faq-miss: 2
  max-bot-turns-faq: 15
  max-bot-turns-intake: 10
  max-repeated-same-action: 2
  max-total-bot-turns: 25

phase-transitions:
  INIT:
    - DISCOVER
  DISCOVER:
    - RESOLVE
    - ESCALATE
  RESOLVE:
    - CONFIRM
    - ESCALATE
  CONFIRM:
    - CLOSE
    - RESOLVE
    - DISCOVER
    - ESCALATE
  ESCALATE:
    - CLOSE
  CLOSE: []

drift-thresholds:
  minor-drift-similarity: 0.85
  soft-shift-confidence: 0.6
