[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csagent-autoloop"
version = "0.1.0"
description = "Auto-evolution loop subsystem for the csagent Skill YAML mutable surface (M-Auto-1A scope)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autoloop = "autoloop.cli:main"

[tool.setuptools.packages.find]
include = ["autoloop*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
