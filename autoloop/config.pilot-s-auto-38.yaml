content_validator:
  # S-Auto-4 — structural integrity checker that runs BEFORE the
  # YAML-diff sandbox. Fails on zero-length / overflow / underflow /
  # corrupted placeholder tokens / forbidden deny-list tokens.

  # Custom placeholder token shapes BEYOND the default 3 generic shapes
  # (curly `{TOKEN}`, dollar `${TOKEN}`, angle `<TOKEN>`). D3: ships
  # empty by default; Salesforce-specific or locale-specific shapes
  # require explicit human curation here.
  custom_token_shapes: []

  # Forbidden-token deny-list — strings that should never appear in a
  # propose `after_value`. Seeded small; deliver-agent + human curate
  # at S-Auto-4 close. Adding entries is a separate sprint decision.
  deny_list:
    - "<<SYSTEM>>"
    - "<<USER>>"

  # Length sanity bounds. `length_overflow_ratio` rejects `after_value`
  # > max(5x `before_value`, `length_overflow_absolute_ceiling`).
  # Adjusted per S-Auto-7.2 (OQ-S62.1): short policy fields (~150-200
  # chars) gaining coherent structural detail were rejected at ratio
  # 5.07x / 5.80x. The absolute_ceiling gives short fields room to
  # grow without weakening the bound on longer fields, where the
  # relative ratio still dominates.
  # S-Auto-8 (2026-05-30): bumped ceiling 1000 → 1200 after exp-13
  # smoke iter rejected `escalate.yaml $.procedure` 143 → 1089 chars
  # (7.61x ratio, ceiling overflow at 1000). The expansion was
  # coherent structural detail, not rambling. New 1200 cap retains
  # the ~7-8x guard for short fields while admitting M-Auto-1B Goal
  # #3 (tier_evaluator end-to-end exercise) on short-procedure
  # propose distributions.
  # `length_underflow_ratio` rejects `after_value` < 0.1x
  # `before_value` IFF `before_value` >= `length_underflow_min_before`.
  length_overflow_ratio: 5.0
  length_overflow_absolute_ceiling: 1200
  length_underflow_ratio: 0.1
  length_underflow_min_before: 50

anti_hardcode:
  # S-Auto-4 — real anti-hardcode detector. Replaces the S-Auto-3
  # placeholder always-PASS hook. Deterministic regex + heuristic
  # (NO LLM, NO new heavy dep). PASS / FAIL / FLAG_FOR_CODEX verdicts.
  enabled: true

  # Synonym-map normalization (e.g. "equals" → "=", "->" → "→"). Off
  # by default; deliver-agent enables after calibration evidence shows
  # it adds detection coverage without spiking false-positive rate.
  #
  # Fix-C step 2 (S-Auto-5, 2026-05-28): Path A — flipped false → true
  # after batch calibration. Evidence: 3 real-meta-agent propose samples
  # (exp-2/3/4) all PASS under synonym_map_enabled=true (0 FP on clean
  # prose); the calibration fixtures in tests/test_anti_hardcode_check.py
  # exercise the detector across the rule families; Codex Axis B exact
  # bypass `Whenever ... =>` is caught (FLAG_FOR_CODEX post-S-Y1.5c) via
  # Q1.if_then_decision_tree after the new word-boundary regex
  # normalization in anti_hardcode_check._normalize(). See
  # docs/sprints/sprint-058-handoff.md §5 for per-sample evidence +
  # OQ-S58.x for the <10 real-sample-count gap.
  # S-Y1.5c severity calibration (2026-06-11): per-pattern verdict
  # distribution shifted from "11 FAIL / 4 PASS / 2 FLAG" to approximately
  # ~2 FAIL / 4 PASS / 11 FLAG fixtures — the six semantic-judgment rules
  # were demoted FAIL → FLAG_FOR_CODEX (see anti_hardcode_check.py _RULES).
  # Narrative only; the smoke/composite distribution is not a close gate.
  synonym_map_enabled: true

  # S-Y1.5c — per-rule severity overrides. Empty default. Each key is a
  # rule_id from anti_hardcode_check.py _RULES; value is "FAIL" or
  # "FLAG_FOR_CODEX". Overrides the _RULES default. Reversibility hatch:
  # if Codex review at S-Y2 close shows a demoted rule was real hardcode
  # that slipped, re-promote here without a code change.
  severity_overrides: {}

  # Operational warning threshold on `FLAG_FOR_CODEX` rate over the
  # calibration table. Above this, detector is too noisy and needs
  # re-calibration before broader use.
  flag_for_codex_rate_warn_threshold: 0.25

gaming:
  # S-Auto-4 — seven post-eval anti-gaming checks. All
  # OBSERVATION-ONLY in v1: flags surface via `experiments_log` +
  # `autoloop audit` but do NOT alter the loop's keep/discard verdict.
  # M-Auto-1B may promote ERROR-severity checks to gating after
  # calibration.
  enabled: true
  observation_only_in_v1: true

  # Shadow-leak signatures. CONFIG-DRIVEN ONLY (D3). The detector must
  # NEVER read `eval_interactive/case_specs_shadow/` content. Adding
  # signatures here is an out-of-band human-approved action.
  shadow_leak_signatures:
    - "cs59s"
    - "shadow_case_id"
    - "shadow/"
    - "case_specs_shadow"

  # Threshold for `anomalous_metric_movement`: improvement_count /
  # diff_chars ratio above which the WARN flag fires.
  anomalous_metric_movement_threshold: 0.05
