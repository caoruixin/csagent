# ================================================================================
# autoloop runtime config — M-Auto-1A S-Auto-1 scope.
#
# The mutable_surface block is the structural anchor for the sandbox.
# It encodes the LOCKED contract from `program.md` §2 and from
# `docs/solutions/auto_evolution_skill_driven_v1.md` §3.1 (collapsed
# tightened version).
#
# To unlock additional Skill files OR additional fields requires a NEW
# milestone + a NEW `program.md` v2 + explicit human authorization (per
# `program.md` §8 Versioning).

mutable_surface:
  # The four LLM-soft field paths that auto-loop's meta-agent may
  # propose edits to. Anything else inside a Skill YAML is structurally
  # rejected by `autoloop/sandbox/yaml_diff_validator.py`.
  allowed_field_paths:
    - "$.procedure"
    - "$.grounding_instruction"
    - "$.escalation_policy"
    - "$.critical_steps[*].desc"

  # The six Skill YAML files whose LLM-soft fields auto-loop may target.
  # File paths are relative to the repo root.
  allowed_skill_files:
    - "server/src/main/resources/skills/discover_triage.yaml"
    - "server/src/main/resources/skills/resolve_faq_grounded_answer.yaml"
    - "server/src/main/resources/skills/resolve_intake_collect_and_handover.yaml"
    - "server/src/main/resources/skills/confirm.yaml"
    - "server/src/main/resources/skills/escalate.yaml"
    - "server/src/main/resources/skills/terminal.yaml"

paths:
  # All paths are relative to the repo root unless otherwise noted.
  # S-Auto-1 does not yet read or write these; S-Auto-3 will populate.
  experiments_log: "autoloop/results/experiments.jsonl"
  iterations_index: "autoloop/results/iterations.jsonl"
  lessons_log: "autoloop/results/lessons.md"
  runs_dir: "autoloop/results/runs/"

# S-Y1.5 (M-Auto-7, 2026-06-09) — PILOT-TARGET STEERING (P0-C).
# The active TARGETED pilot's success card. The meta-agent reads this so
# the proposer/analyzer know which cases are the PRIMARY TARGETS (to move),
# the anti-误杀 control (must NOT regress), and the tier2 neighbors. Absent
# block → empty PILOT_PRIMARY_TARGETS (pre-S-Y1.5 general-hill-climber
# behaviour; backward compatible). The config-load validator
# (config_validator.validate_pilot_config) REJECTS any case_id here that
# collides with a shadow case_spec FILENAME (filenames only — never reads
# contents). These are evaluation bookkeeping labels ONLY; they are NEVER
# injected into a Skill YAML edit (propose.txt §1.7 labels-only directive +
# anti-hardcode Q4).
pilot:
  schema_version: 1
  active_sprint: "S-Y2"
  primary_targets: [cs_uc_a_no_ad_id_ad_specific, cs_uc_a_loaded_listing]
  anti_kill_control: [cs_uc_a_generic_policy_question]
  tier2_neighbors: [cs_uc_a_lookup_failed, cs_uc_fp_loaded_moderation]
  phase_hint: [DISCOVER, RESOLVE]
  use_case_hint: [UC-A]

lessons:
  # K — every K iterations the lessons LLM produces a compacted lessons
  # block per `program.md` and the proposal §3.4 (three-layer memory).
  # S-Auto-3 reads this; S-Auto-1 only persists the value.
  compaction_window_k: 10
  # How many recent iterations to summarize into the proposer prompt.
  # S-Auto-3 reads this from config.
  recent_iterations_for_propose: 5
  # S-Y1.5 (P1) — lessons opt-out. When false, the proposer's LESSONS_MD
  # block is replaced by a placeholder (NOT empty); the file + compactor
  # are untouched. Default false for the S-Y2 pilot: the L-001..L-005
  # lessons were compacted from pre-CS4 all-discard windows (May-31) and
  # point the proposer at a pre-CS4 escalation cluster, away from the CS4
  # entity-context gap. Set true to restore historical-lesson injection.
  enabled: false

meta_agent:
  # Meta-agent LLM configuration for analyzer / proposer / lessons_compactor.
  # Provider: AICodeWith (https://api.aicodewith.com) — Anthropic-compatible
  # protocol per https://docs.aicodewith.com/en/docs/claude-code (the service
  # exposes Claude / Codex / Gemini through Anthropic-style env vars).
  #
  # Credentials live in `autoloop/.env.local` (gitignored). The env-var
  # NAMES are autoloop-namespaced (NOT the AICodeWith-recommended
  # ANTHROPIC_AUTH_TOKEN / ANTHROPIC_BASE_URL) to avoid colliding with
  # any system-wide Anthropic env vars the human may have set for other
  # tools (e.g. Claude Code, other Anthropic SDK clients). S-Auto-3 dev
  # passes them explicitly to the SDK constructor:
  #   client = anthropic.Anthropic(
  #       api_key=os.environ["AUTOLOOP_META_LLM_API_KEY"],
  #       base_url=os.environ.get("AUTOLOOP_META_LLM_BASE_URL"),
  #   )
  provider: anthropic                   # SDK: `anthropic` Python package; Anthropic-compatible API
  # DEFAULT model. 2026-06-16 (M-Auto-7 S-Y2 Part C): changed claude-opus-4-7 →
  # claude-sonnet-4-6 for proposer latency/reliability after opus-4-7 hit an
  # APITimeoutError through the AICodeWith gateway at the 120s request timeout
  # (exp-80). sonnet-4-6 is faster + more reliable; opus-4-7 (higher reasoning)
  # stays selectable by setting AUTOLOOP_META_LLM_MODEL in autoloop/.env.local.
  model: claude-sonnet-4-6
  model_env: AUTOLOOP_META_LLM_MODEL    # if set (autoloop/.env.local) OVERRIDES `model` above
  temperature: 0.3                       # low for reproducibility of propose / analyze
  max_tokens: 4096
  api_key_env: AUTOLOOP_META_LLM_API_KEY
  base_url_env: AUTOLOOP_META_LLM_BASE_URL
  request_timeout_seconds: 120
  # S-Y1.5 (P0-B) — how many recent CANDIDATE iterations' persisted
  # eval-results.json the analyzer reads so the failure taxonomy reflects
  # candidate-introduced regressions, not only the static baseline. Shadow
  # detail is firewalled to aggregate-only in the candidate summary.
  recent_candidate_results_k: 3

fitness:
  # v1 minimal fitness suite — human-locked 2026-05-27 dataset scope.
  # anchor (159) is NOT here per docs/milestone_objective.md §2
  # dataset-scope; M-Auto-2 may revisit. Each suite is invoked via
  # `eval-interactive run --path <suite> --parallel <N>
  #  --output-dir <results_root>/<suite>/` by
  # autoloop/scoring/eval_runner.py. Paths are repo-root-relative.
  suites:
    - name: bad_cases
      path: eval_interactive/case_specs/bad_cases/
      parallel: 4                    # 2026-06-16 sweep (warm-backend, 17 cases): 1->4 = 3.0x faster (401s->134s), 0 timeout/give-up/infra, 0 estab-fail at 2&4 (the lone estab-fail was at parallel=1). Was 1 for M5 session-establishment flakiness; sweep did not reproduce it under concurrency. Watch non_comparable_rate (V3 tolerates a thinned primary case).
    - name: anchor_outcome
      path: eval_interactive/case_specs/anchor_outcome/
      parallel: 4                    # 2026-06-16 sweep (warm-backend, 12 anchor cases): 2->4 = 2.1x faster (107s->51s), 0 timeout/give-up/infra; OQ-S65.8 give-up degradation did NOT reproduce at 4 or 6, and 6 saturates (no gain over 4). Restored toward the pre-OQ-S65.8 value.
    - name: shadow
      path: eval_interactive/case_specs_shadow/
      parallel: 4                    # 2026-06-16 sweep (warm-backend, 12 anchor cases): 2->4 = 2.1x faster (107s->51s), 0 timeout/give-up/infra; OQ-S65.8 give-up degradation did NOT reproduce at 4 or 6, and 6 saturates (no gain over 4). Restored toward the pre-OQ-S65.8 value.

  # Layer 3 improvement-threshold mode. 'case_count' is the v1 choice
  # (2026-05-27 human-locked); a 'percent' mode is reserved for
  # later milestones where N is larger and a 2% threshold becomes
  # meaningful (12+12=24 cases makes 2% = 0.48 cases, which is not).
  improvement_threshold_mode: case_count
  improvement_min_cases: 1

  # S-Y1.7 (M-Auto-7) — NOISE-AWARE fitness gate (V3 rule). The TIER-N
  # statistic + floors + cross-case rule that REPLACE the old zero-tolerance
  # gates. Encoded per docs/solutions/p07-calibration/ (calibrate.py reference
  # + p07-findings.md F1-F5). These knobs are evidence-backed defaults, NOT
  # certifiable at n=5 (F5 power ceiling) — they are confirmed on the first
  # S-Y2 pilot run under this gate, not by the zero-LLM oracle.
  #
  # The OLD knobs this block replaces:
  #   - shadow_max_drop_pct: 3.0           (Layer 4 raw 3pp count gate; C2:
  #     replaced by a Beta-Binomial posterior on the shadow aggregate pass
  #     count, reusing delta/p_regress below — a sub-1-case wobble no longer
  #     gates, e.g. exp-72's 25%→21.1% releases).
  #   - anchor_outcome_max_drop_cases: 0   (Layer 1 zero-tolerance max-drop;
  #     replaced by the TIER-N posterior + cross_case_count below — a single
  #     flaky anchor drop no longer gates, e.g. exp-71/79 release).
  tier_decision:
    # TOST equivalence margin: a candidate within +/- delta of baseline is
    # behaviour-neutral. P_regress = P(p_cand < p_base - delta) on Jeffreys
    # Beta-Binomial posteriors; symmetric P_improve = P(p_cand > p_base + delta).
    delta: 0.10
    # Per-case decision thresholds: P_regress >= p_regress -> regressed;
    # p_ambiguous_low <= P_regress < p_regress -> ambiguous (held, not gated);
    # symmetric on P_improve for "improved" (Layer 3).
    p_regress: 0.80
    p_ambiguous_low: 0.50
    # Cross-case discard: BH-FDR at alpha_fdr flags >=1 (joint with the
    # per-case p_regress floor), OR >= cross_case_count cases at
    # P_regress >= p_regress. count>=2 is the discriminator that separates
    # genuine multi-case harm (exp-69, 3 cases) from single-case noise
    # (exp-71/79, 1 case). Human decision 2026-06-16: cross-case stays count>=2.
    alpha_fdr: 0.10
    cross_case_count: 2

  # Explicit baseline pointer (no auto-latest heuristic). Blessed at
  # S-Auto-7 close (2026-05-29) per docs/sprints/sprint-060-handoff.md
  # §6: a staging directory at the path below contains per-suite
  # symlinks to the three eval-interactive runs that constitute the
  # M-Auto-1B baseline (bad_cases run-id 20260529-101324 / 12 cases /
  # anchor_outcome run-id 20260529-102054 / 12 cases / shadow run-id
  # 20260529-102949 / 22 cases — 46 cases total). The shadow count
  # is 22 (not the previously-assumed 23) because `_manifest.yaml`
  # at the top level was the 23rd entry and is a manifest, not a
  # case_spec; loader fix landed in S-Auto-7 skips `_*.yaml` files.
  # Re-blessing at any future milestone is a deliver-agent + human
  # decision per `gaming.suspect_baseline_manipulation` notes.
  #
  # S-Auto-17 (2026-06-04, M-Auto-4): re-blessed as an AGGREGATED (majority-
  # over-n=5) artifact so the baseline side is symmetric with the live n=3
  # candidate (flipping n>1 against a single-draw baseline manufactures
  # regressions — the asymmetry this sub-sprint removes). Each suite dir holds
  # `aggregated.json` (per-case majority_passed + pass_rate + stability_class);
  # baseline_loader prefers it over results.json. Honest-majority shift vs the
  # retained single-draw baseline: bad_cases 5→5, anchor_outcome 7→4 (3 lucky
  # single-draw passes are majority-fails), shadow 4→2 (+2 now non_comparable
  # instead of mis-counted as failures: cs59s01/cs59s02 hard-error on session
  # create — pre-existing infra, see sprint-073 handoff §3). The OLD single-run
  # baseline is RETAINED on disk (m-auto-1b-baseline-20260529) and never
  # overwritten — only this POINTER moves (reversible). git_commit recorded in
  # each aggregated.json. Expect `gaming.suspect_baseline_manipulation` to
  # observe this change (intended; recorded in the handoff).
  # Prior pointers: eval_interactive/results/m-auto-1b-baseline-20260529,
  #                 eval_interactive/results/m-auto-4-baseline-20260604.
  # M-Auto-5 close 2026-06-05: pointer moved to the simulator-fixed +
  # stall-not-gated authoritative re-re-bless. Corrected measurement across
  # all four columns (eval read / runtime stamp / input simulator / gate
  # vacuous-pass + runtime stamp downgrade). Codex §4.1 milestone-shared
  # review APPROVE_WITH_NON_BLOCKING_OBSERVATIONS (blocking_count=0); §5.9
  # pre-flight sweep PASS (0/414 vacuous-pass + terminal-failure matches);
  # paired-evidence review 10 F→P / 0 P→F across bad_cases + anchor_outcome
  # + shadow (anti-误杀 held in both directions). Older baseline dirs
  # (m-auto-1b-baseline-20260529, m-auto-4-baseline-20260604,
  # m-auto-5-baseline-20260604, m-auto-5-baseline-20260605,
  # m-auto-5-baseline-20260604-simfixed,
  # m-auto-5-baseline-20260604-simfixed-stalledfix) retained on disk as
  # forensic-only.
  #
  # M-Auto-6 close (2026-06-07) — route-(b) accept-with-known-regression
  # (per docs/milestone_objective.md §5 + docs/action_bank.md §5).
  # Milestone-shared re-bless ran at git_commit=27b5239, n=9, multi-suite
  # (bad_cases + anchor_outcome + shadow); anti-误杀 CLEAN (HARD=0 across
  # 36 anchor attempts + 18 cs38s* attempts; 0/36 self-resolve); five
  # accepted regressions attributed to pre-existing semantic flakiness
  # (R5/R6/R2.a exonerated per docs/diagnostics/2026-06-07-m-auto-6-anchor-overpass-diagnostic.md);
  # A6 anti-误杀 reframed from "0.000 floor" to "safety-of-pass"
  # (preflight-eval-checks.md §2/§3/§5/§7; scope = uc_g/h/i/j +
  # cs38s01/cs38s02). Codex milestone-shared §4.3 verdict
  # APPROVE_M_AUTO_6_WITH_NON_BLOCKING_OBSERVATIONS / blocking_count=0
  # archived at docs/milestones/M-Auto-6_codex-review.md.
  # S-Y2 PILOT SETUP (2026-06-08, human-authorized OQ-S87.baseline-dir = (a)):
  # baseline_dir points at the M-Auto-7 pre-pilot baseline as the pilot's
  # FITNESS / EXPERIMENT baseline. This is NOT a canonical baseline promotion:
  # docs/current_eval_baseline.md is UNCHANGED; m-auto-6-baseline-shared-20260607
  # remains the PREVIOUS CANONICAL baseline; whether to promote the post-pilot
  # result to canonical is a separate human milestone-close decision (after the
  # Part D milestone-close re-bless + Codex review). See docs/sprint_objective.md
  # (S-Y2) §Baseline policy.
  baseline_dir: eval_interactive/results/m-auto-7-prepilot-baseline-20260618-s_auto_38_split_full

  # Hard cap per suite (30 min). A timeout aborts the loop iteration
  # — partial fitness evidence is worse than no fitness evidence.
  eval_suite_timeout_seconds: 1800

  # Sequential suite execution in v1. M-Auto-2 may parallelize, but
  # only after evaluating LLM-provider rate-limit + bad-case
  # session-establishment flakiness interaction.
  parallel_suites: false

  # S-Auto-16 (M-Auto-4) — k-of-n fitness-measurement reliability.
  # S-Auto-17 (2026-06-04) FLIPPED LIVE 1→3: now sound because the baseline
  # was re-blessed as an aggregated majority-over-n=5 artifact FIRST (see
  # baseline_dir above), so BOTH sides are majority — the candidate path
  # (tier_evaluator._effective_case_passed) and the baseline path
  # (baseline_loader._summarize_aggregated / _baseline_case_pass_map read
  # majority_passed) are symmetric. Each live iteration runs every suite 3×
  # and collapses per-case pass/fail to a strict majority over provider-
  # comparable (configured-primary) draws; a single noisy flip no longer
  # gates. Provider comparability anchors on provider_policy.primary_model.
  #
  # S-Y1.7 (2026-06-16, M-Auto-7) FLIPPED 3→5 (P0.4): the noise-aware V3 gate
  # (tier_decision above) needs the higher default n so the TIER-N posteriors
  # are not dominated by 0/3-vs-3/3 swings. The P0.7 retrospective calibration
  # found the prior gate false-discarded behaviour-neutral candidates ~92-95%
  # of the time at n=3-5; n=5 default + n=11 primary-target oversampling
  # (fitness.pilot below) is the resampling the calibration calls for. Near-
  # coinflip cases (p≈0.5) still get ~0 variance reduction from a larger n and
  # are surfaced for eval_spec/semantic triage rather than force-stabilized
  # (OQ-S72.2; stability_thresholds below unchanged).
  #
  # S-Y1.7 PILOT-THROUGHPUT TUNE (2026-06-16): reduced 5→3 after the first live
  # S-Y2 Part C run showed ~5h/experiment (broad n=5 over ~29 cases at suite
  # parallelism 1-2 ⇒ -n 6 ≈ 1.5 days). The 2 primary targets stay at n=11
  # (pilot.primary_targets_samples) — the asymmetric allocation P0.4 calls for
  # ("spend attempts where lift is expected"). Throughput-only: the V3 gate
  # logic + the P0.7 oracle (archived-data replay) are unaffected by the live n.
  samples_per_case: 3

  # S-Y1.7 (P0.4) — primary-target oversampling. The active S-Y2 pilot's
  # primary_targets (named in the TOP-LEVEL `pilot:` block) are the cases the
  # candidate is trying to MOVE; they are sampled at this higher n so the
  # posterior on the moved case is tight enough to credit a real improvement
  # over noise. Consumed by the eval_runner n-loop at pilot-run time; all other
  # cases use `samples_per_case`. Evidence-backed default, NOT certifiable at
  # n=5 (F5) — confirmed on the first S-Y2 pilot run under the new gate.
  pilot:
    primary_targets_samples: 11
  aggregation:
    method: majority
    # Floor of provider-comparable attempts for a gating verdict. Below
    # it a case is non_comparable / infra_error and does NOT gate.
    min_valid_attempts: 3
    # Extra full passes run when a case is short of min_valid_attempts.
    attempt_retry_cap: 2
  provider_policy:
    # Autoloop fitness eval is primary-provider-only so the majority vote
    # is over one model population (the product runtime keeps its own
    # fallback chain — this governs the FITNESS harness only). Fallback
    # comparability is derived from the eval results.json llm_calls[].model
    # field. An attempt served by the fallback is dropped (provider_mixed).
    fitness_provider: primary_only
    prefer_retry_primary: true
    on_fallback: drop_attempt_non_comparable
    record_per_attempt: [actual_provider, actual_model, fallback_count, request_id]
    # S-Auto-17 (OQ-S72.1): the CONFIGURED primary chat model name. Provider
    # comparability anchors on THIS string, not the per-run empirical modal
    # model. A `chat`-callType call whose `model` != this value is a real
    # fallback (provider_mixed → dropped from the vote), even when the
    # fallback engaged for the WHOLE run (the bug the modal heuristic missed).
    # Source of truth: the backend's configured chat model — the exact string
    # eval-interactive records in `llm_calls[].model` for callType=="chat".
    # Sourced 2026-06-03 from DEEPSEEK_MODEL in the repo-root .env.local and
    # cross-checked against the M-Auto-1B baseline results.json (chat model
    # = `deepseek-v4-flash` across all three suites). Fail-safe: if unset/
    # empty, eval_runner._run_majority_passes RAISES EvalRunnerConfigError
    # rather than degrading to "modal == primary".
    primary_model: deepseek-v4-flash

  # S-Auto-17 (OQ-S72.2): per-case stability classification thresholds for
  # the baseline re-bless. A cardinality policy over the majority pass_rate
  # (NOT over case content). `stable` cases are hard anchors; `near-coinflip`
  # cases (p≈0.5) get ~0 variance reduction from a k-of-n majority and are
  # surfaced as an eval_spec / semantic-ambiguity signal (NOT force-stabilized
  # with a larger n). Defaults: stable if pass_rate <= 0.2 or >= 0.8;
  # near-coinflip if 0.4 <= pass_rate <= 0.6; reducible-flaky otherwise.
  # Consumed by autoloop/scripts/rebless_baseline.py + aggregate.classify_stability.
  stability_thresholds:
    stable_low: 0.2
    stable_high: 0.8
    coinflip_low: 0.4
    coinflip_high: 0.6

  # S-Auto-4 — scoring-code drift baseline. The value here is the
  # SHA-256 content hash produced by `gaming._compute_scoring_code_sha()`
  # over the five files (`tier_evaluator.py` + `eval_runner.py` +
  # `baseline_loader.py` + `gaming.py` + `aggregate.py`). S-Auto-16
  # widened the set from four to five: `aggregate.py` produces the
  # majority_passed verdict the fitness gate consumes, so it joins the
  # drift coverage.
  #
  # Original M-Auto-1A close value (2026-05-27 against commit `1feef1f`)
  # was `5177b674b5ad249d7c0e706f3c827010c8dab511240f239dbd3be6f689a0331c`.
  # First fill attempt was the literal git commit SHA `"1feef1f"`,
  # which Codex per-sub-sprint review (`docs/codex-findings.md`
  # Axis C milestone-shared note 2026-05-27) flagged as a format
  # mismatch — gaming.py compares against this content hash, not
  # against a git commit id, so `1feef1f` produced an
  # observation-only `scoring_code_drift.sha_changed` on every
  # iteration. Resolved at S-Auto-4 close-bundle fix-up by computing
  # the actual hash and recording it here.
  #
  # S-Auto-7 close (2026-05-29) rebaselined to the value below after
  # Blocker B fix path (b) modified `eval_runner.py` (fence #13
  # controlled override; the other three scoring files remain
  # byte-identical to their M-Auto-1A close form). Reproducibility:
  # `uv run --extra dev python -c "from autoloop.scoring.gaming \
  # import _compute_scoring_code_sha; print(_compute_scoring_code_sha())"`
  # at S-Auto-7 HEAD must reproduce the value below. See
  # `docs/sprints/sprint-060-handoff.md` §5.
  #
  # Subsequent commits touching any of these five files will
  # trigger `gaming.scoring_code_drift.sha_changed` ERROR (intended
  # behaviour). If reset to null, the check emits WARN
  # `rule_id=scoring_code_drift.baseline_missing` (D3: never guess;
  # never silently hash-as-baseline).
  # S-Auto-10 (2026-05-31, OQ-S65.5): rebaselined after a human-authorized
  # fence-#13 controlled override to eval_runner.run_suite — it now resolves the
  # repo-root-relative suite path to an absolute path before passing --path to
  # eval-interactive (cwd=eval_interactive previously doubled the path segment,
  # so every candidate eval crashed with FileNotFoundError and was silently
  # scored as 0 cases passed -> spurious tier1 5->0 on every iteration). Prior
  # value (S-Auto-7 close): 22548e20ea50518b35c78cebddde891ddb46ea0452e32e49518ad4caab9188a9.
  # S-Auto-10 (2026-05-31, OQ-S65.6): rebaselined again after a 2nd human-authorized
  # fence-#13 override to tier_evaluator._evaluate_layer0 — Layer 0 is now a DELTA
  # vs baseline (fails only on NEWLY-introduced Tier-0 violations; pre-existing
  # baseline bad-case failures are ignored) instead of an absolute floor that made
  # `keep` unsatisfiable. Prior value (OQ-S65.5): 7b9954f212afe61946631afd1737f23f7b94f659095ab6b1769a0c86aa29a6e9.
  # S-Auto-16 (2026-06-03, M-Auto-4): rebaselined after the k-of-n fitness-
  # measurement machinery landed — `aggregate.py` (NEW) joined the hash set
  # (four -> five files), and `eval_runner.py` (n-loop + per-attempt
  # aggregation), `tier_evaluator.py` (majority signal + L0 stable-
  # reproduction), and `gaming.py` (widened set) were edited. All edits are
