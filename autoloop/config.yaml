# autoloop runtime config — M-Auto-1A S-Auto-1 scope.
#
# The mutable_surface block is the structural anchor for the sandbox.
# It encodes the LOCKED contract from `program.md` §2 and from
# `docs/solutions/auto_evolution_skill_driven_v1.md` §3.1 (collapsed
# tightened version).
#
# To unlock additional Skill files OR additional fields requires a NEW
# milestone + a NEW `program.md` v2 + explicit human authorization (per
# `program.md` §8 Versioning).

mutable_surface:
  # The four LLM-soft field paths that auto-loop's meta-agent may
  # propose edits to. Anything else inside a Skill YAML is structurally
  # rejected by `autoloop/sandbox/yaml_diff_validator.py`.
  allowed_field_paths:
    - "$.procedure"
    - "$.grounding_instruction"
    - "$.escalation_policy"
    - "$.critical_steps[*].desc"

  # The six Skill YAML files whose LLM-soft fields auto-loop may target.
  # File paths are relative to the repo root.
  allowed_skill_files:
    - "server/src/main/resources/skills/discover_triage.yaml"
    - "server/src/main/resources/skills/resolve_faq_grounded_answer.yaml"
    - "server/src/main/resources/skills/resolve_intake_collect_and_handover.yaml"
    - "server/src/main/resources/skills/confirm.yaml"
    - "server/src/main/resources/skills/escalate.yaml"
    - "server/src/main/resources/skills/terminal.yaml"

paths:
  # All paths are relative to the repo root unless otherwise noted.
  # S-Auto-1 does not yet read or write these; S-Auto-3 will populate.
  experiments_log: "autoloop/results/experiments.jsonl"
  iterations_index: "autoloop/results/iterations.jsonl"
  lessons_log: "autoloop/results/lessons.md"
  runs_dir: "autoloop/results/runs/"

lessons:
  # K — every K iterations the lessons LLM produces a compacted lessons
  # block per `program.md` and the proposal §3.4 (three-layer memory).
  # S-Auto-3 reads this; S-Auto-1 only persists the value.
  compaction_window_k: 10
  # How many recent iterations to summarize into the proposer prompt.
  # S-Auto-3 reads this from config.
  recent_iterations_for_propose: 5

meta_agent:
  # Meta-agent LLM configuration for analyzer / proposer / lessons_compactor.
  # Provider: AICodeWith (https://api.aicodewith.com) — Anthropic-compatible
  # protocol per https://docs.aicodewith.com/en/docs/claude-code (the service
  # exposes Claude / Codex / Gemini through Anthropic-style env vars).
  #
  # Credentials live in `autoloop/.env.local` (gitignored). The env-var
  # NAMES are autoloop-namespaced (NOT the AICodeWith-recommended
  # ANTHROPIC_AUTH_TOKEN / ANTHROPIC_BASE_URL) to avoid colliding with
  # any system-wide Anthropic env vars the human may have set for other
  # tools (e.g. Claude Code, other Anthropic SDK clients). S-Auto-3 dev
  # passes them explicitly to the SDK constructor:
  #   client = anthropic.Anthropic(
  #       api_key=os.environ["AUTOLOOP_META_LLM_API_KEY"],
  #       base_url=os.environ.get("AUTOLOOP_META_LLM_BASE_URL"),
  #   )
  provider: anthropic                   # SDK: `anthropic` Python package; Anthropic-compatible API
  model: claude-opus-4-7                # best-reasoning default for meta-agent; downgrade to claude-sonnet-4-6 for cost/latency if needed
  temperature: 0.3                       # low for reproducibility of propose / analyze
  max_tokens: 4096
  api_key_env: AUTOLOOP_META_LLM_API_KEY
  base_url_env: AUTOLOOP_META_LLM_BASE_URL
  request_timeout_seconds: 120

fitness:
  # v1 minimal fitness suite — human-locked 2026-05-27 dataset scope.
  # anchor (159) is NOT here per docs/milestone_objective.md §2
  # dataset-scope; M-Auto-2 may revisit. Each suite is invoked via
  # `eval-interactive run --path <suite> --parallel <N>
  #  --output-dir <results_root>/<suite>/` by
  # autoloop/scoring/eval_runner.py. Paths are repo-root-relative.
  suites:
    - name: bad_cases
      path: eval_interactive/case_specs/bad_cases/
      parallel: 1                    # bad-case session-establishment flakiness mitigation per M5-close R-item
    - name: anchor_outcome
      path: eval_interactive/case_specs/anchor_outcome/
      parallel: 4
    - name: shadow
      path: eval_interactive/case_specs_shadow/
      parallel: 4

  # Layer 3 improvement-threshold mode. 'case_count' is the v1 choice
  # (2026-05-27 human-locked); a 'percent' mode is reserved for
  # later milestones where N is larger and a 2% threshold becomes
  # meaningful (12+12=24 cases makes 2% = 0.48 cases, which is not).
  improvement_threshold_mode: case_count
  improvement_min_cases: 1

  # Layer 4 shadow gate. 3% drop tolerance is the proposal §3.3 v1
  # threshold; tightening / loosening is a future-milestone decision.
  shadow_max_drop_pct: 3.0

  # Layer 1 anchor_outcome strictness. 0 = no programmatic-pass case
  # may flip down between baseline and current.
  anchor_outcome_max_drop_cases: 0

  # Explicit baseline pointer (no auto-latest heuristic). Deliver-agent
  # + human bless the actual baseline run path at M-Auto-1A close OR
  # at first S-Auto-3 live-iteration; the literal placeholder below is
  # what S-Auto-2 commits.
  baseline_dir: eval_interactive/results/<PLACEHOLDER-set-at-M-Auto-1A-close>

  # Hard cap per suite (30 min). A timeout aborts the loop iteration
  # — partial fitness evidence is worse than no fitness evidence.
  eval_suite_timeout_seconds: 1800

  # Sequential suite execution in v1. M-Auto-2 may parallelize, but
  # only after evaluating LLM-provider rate-limit + bad-case
  # session-establishment flakiness interaction.
  parallel_suites: false

  # S-Auto-4 — scoring-code drift baseline. The value here is the
  # SHA-256 content hash produced by `gaming._compute_scoring_code_sha()`
  # over the four files (`tier_evaluator.py` + `eval_runner.py` +
  # `baseline_loader.py` + `gaming.py`) at their M-Auto-1A close form
  # (computed at S-Auto-4 close 2026-05-27 against the bytes at
  # commit `1feef1f`).
  #
  # First fill attempt was the literal git commit SHA `"1feef1f"`,
  # which Codex per-sub-sprint review (`docs/codex-findings.md`
  # Axis C milestone-shared note 2026-05-27) flagged as a format
  # mismatch — gaming.py compares against this content hash, not
  # against a git commit id, so `1feef1f` produced an
  # observation-only `scoring_code_drift.sha_changed` on every
  # iteration. Resolved at S-Auto-4 close-bundle fix-up by computing
  # the actual hash and recording it here.
  #
  # Subsequent commits touching any of these four files will
  # trigger `gaming.scoring_code_drift.sha_changed` ERROR (intended
  # behaviour). If reset to null, the check emits WARN
  # `rule_id=scoring_code_drift.baseline_missing` (D3: never guess;
  # never silently hash-as-baseline).
  scoring_code_baseline_sha: "5177b674b5ad249d7c0e706f3c827010c8dab511240f239dbd3be6f689a0331c"

content_validator:
  # S-Auto-4 — structural integrity checker that runs BEFORE the
  # YAML-diff sandbox. Fails on zero-length / overflow / underflow /
  # corrupted placeholder tokens / forbidden deny-list tokens.

  # Custom placeholder token shapes BEYOND the default 3 generic shapes
  # (curly `{TOKEN}`, dollar `${TOKEN}`, angle `<TOKEN>`). D3: ships
  # empty by default; Salesforce-specific or locale-specific shapes
  # require explicit human curation here.
  custom_token_shapes: []

  # Forbidden-token deny-list — strings that should never appear in a
  # propose `after_value`. Seeded small; deliver-agent + human curate
  # at S-Auto-4 close. Adding entries is a separate sprint decision.
  deny_list:
    - "<<SYSTEM>>"
    - "<<USER>>"

  # Length sanity bounds. `length_overflow_ratio` rejects `after_value`
  # > 5x `before_value`. `length_underflow_ratio` rejects `after_value`
  # < 0.1x `before_value` IFF `before_value` >= `length_underflow_min_before`.
  length_overflow_ratio: 5.0
  length_underflow_ratio: 0.1
  length_underflow_min_before: 50

anti_hardcode:
  # S-Auto-4 — real anti-hardcode detector. Replaces the S-Auto-3
  # placeholder always-PASS hook. Deterministic regex + heuristic
  # (NO LLM, NO new heavy dep). PASS / FAIL / FLAG_FOR_CODEX verdicts.
  enabled: true

  # Synonym-map normalization (e.g. "equals" → "=", "->" → "→"). Off
  # by default; deliver-agent enables after calibration evidence shows
  # it adds detection coverage without spiking false-positive rate.
  synonym_map_enabled: false

  # Operational warning threshold on `FLAG_FOR_CODEX` rate over the
  # calibration table. Above this, detector is too noisy and needs
  # re-calibration before broader use.
  flag_for_codex_rate_warn_threshold: 0.25

gaming:
  # S-Auto-4 — seven post-eval anti-gaming checks. All
  # OBSERVATION-ONLY in v1: flags surface via `experiments_log` +
  # `autoloop audit` but do NOT alter the loop's keep/discard verdict.
  # M-Auto-1B may promote ERROR-severity checks to gating after
  # calibration.
  enabled: true
  observation_only_in_v1: true

  # Shadow-leak signatures. CONFIG-DRIVEN ONLY (D3). The detector must
  # NEVER read `eval_interactive/case_specs_shadow/` content. Adding
  # signatures here is an out-of-band human-approved action.
  shadow_leak_signatures:
    - "cs59s"
    - "shadow_case_id"
    - "shadow/"
    - "case_specs_shadow"

  # Threshold for `anomalous_metric_movement`: improvement_count /
  # diff_chars ratio above which the WARN flag fires.
  anomalous_metric_movement_threshold: 0.05
